22%231a2128%22%20stroke-width%3D%224%22%20stroke-linejoin%3D%22round%22/%3E%20%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#1e252f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..800;1,400&family=Barlow+Condensed:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500..800&display=swap">
<style>
:root{
  --bg:#dfe5ea;--mat:#cbd5de;--panel:#f3f6f8;--ink:#1a2128;--muted:#5d6975;--line:#a9b6c2;
  --face:#fbfcfd;--back:#33405a;--back2:#4a5a7c;--hi:#1e6fd9;--danger:#c8321f;--ok:#2e8b46;
  --font-ui:"Atkinson Hyperlegible Next","Atkinson Hyperlegible","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow","Avenir Next Condensed",sans-serif;
  --font-display:Fraunces,"Palatino Linotype",Palatino,Georgia,serif;
  --frame:#b3bfcb;--inset:#d5dde5;--shadow:0 1px 2px rgba(16,24,32,.12),0 8px 24px rgba(16,24,32,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161c;--mat:#1a2029;--panel:#1e252f;--ink:#e6ebf0;--muted:#94a0ad;--line:#36414e;
    --face:#232b36;--back:#5a6b94;--back2:#3d4a68;--hi:#6aa5ff;--danger:#ff6b55;--ok:#5fcf7b;
    --frame:#2d3746;--inset:#131820;--shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
/* thin rounded scrollbars in the theme's colors (page, dropdowns, log, card viewers) */
/* the page always keeps room for its scrollbar, so filtering to a short list doesn't shift everything sideways */
html{scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(1100px 520px at 50% -8%,var(--mat),transparent 70%) var(--bg) no-repeat;color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--font-display);font-optical-sizing:auto;font-weight:650;letter-spacing:-.01em}
/* names and numbers use the condensed face, like a printed card's name bar and power box */
.nm,.cost,.pw,.rc,.trg,.tag,.mana,.lbl,.step,.turn,.cnt,.bc span,.mgroup small,.curve,.pill,.code,.mk,.tstep,.back.shield{font-family:var(--font-num);font-variant-numeric:tabular-nums}
/* Buttons are pills like the card's power badge: the main action filled deep, the rest soft. */
button{font:inherit;font-weight:600;cursor:pointer;border:0;background:var(--face);color:var(--ink);padding:7px 15px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);transition:background .12s,box-shadow .12s,transform .12s}
button:hover{background:var(--mat);box-shadow:inset 0 0 0 1.5px var(--muted)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.main{background:var(--ink);color:var(--bg);box-shadow:none}
button.main:hover{background:var(--ink);box-shadow:0 0 0 3px var(--frame)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#app{--pad:10px;max-width:1100px;margin:0 auto;padding:var(--pad) 10px 10px}
.side{background:var(--mat);border-radius:18px;padding:12px 14px;display:grid;gap:10px;box-shadow:inset 0 0 0 1px var(--frame)}
.info{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted)}
/* the player's name plate, like a card's name bar */
.info b{color:var(--ink);font-size:15px;background:var(--face);padding:3px 13px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--frame)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.stack{display:grid;gap:6px;justify-items:start}
.stack .lbl{min-width:64px}
/* zones are recessed windows, like the card's art window */
.zone{display:flex;flex-wrap:wrap;gap:8px;min-height:190px;align-items:flex-start;background:var(--inset);border-radius:14px;padding:10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.16)}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.shields{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border-radius:8px}
.shields.attacked{box-shadow:0 0 0 3px var(--danger);padding:2px 4px}
.back{width:30px;height:42px;border-radius:4px;background:repeating-linear-gradient(45deg,var(--back) 0 6px,var(--back2) 6px 12px);border:1.5px solid var(--ink)}
.back.shield{display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;text-shadow:0 1px 2px #000c;transition:transform .12s}
.back.shield.target{box-shadow:0 0 0 3px var(--danger);cursor:pointer;transform:translateY(-3px)}
.lbl{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.manas{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.mgroup{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center}
.mgroup small{color:var(--muted);font-size:14px;font-weight:600;margin-left:2px}
button.link{border:none;background:none;box-shadow:none;padding:0;font-weight:inherit;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;border-radius:3px}
button.link:hover{background:none;box-shadow:none;color:var(--ink)}
.mana{width:22px;height:22px;border-radius:50%;background:var(--el);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28),0 0 0 1px rgba(0,0,0,.3)}
.mana.used{opacity:.3}
/* Card layout from the 112px design, in container units so every display size keeps its proportions. */
.card{position:relative;container-type:inline-size;width:112px;aspect-ratio:112/174;flex:none;border-radius:8%/5.2%;background:var(--fr);cursor:pointer;transition:transform .15s}
.cbody{height:100%;box-sizing:border-box;padding:3.6cqw;display:flex;flex-direction:column;gap:2.7cqw}
.nbar{display:flex;gap:3.6cqw;align-items:center;background:var(--lt);border-radius:4.5cqw;padding:1.8cqw 3.6cqw;min-height:23cqw;flex:none}
.cost{flex:none;width:17cqw;height:17cqw;border-radius:50%;background:var(--dp);color:var(--lt);font-weight:700;font-size:11.8cqw;display:grid;place-items:center}
.nm{min-width:0;font-weight:700;font-size:10.6cqw;line-height:1.02;letter-spacing:.01em;color:var(--dp);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.art{position:relative;height:50cqw;flex:none;border-radius:4.5cqw;overflow:hidden;background:var(--md)}
.art svg{display:block;width:100%;height:100%}
.art img{display:block;width:100%;height:100%;object-fit:cover}
.missing-art{height:100%;display:grid;place-items:center;text-align:center;padding:10%;font-size:7cqw;color:var(--dp);background:var(--lt)}
.trg{position:absolute;right:2.7cqw;top:1.8cqw;font-size:8cqw;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--dp);color:var(--lt);padding:0 3.6cqw;border-radius:2.7cqw}
.txt{min-height:0;background:var(--lt);border-radius:4.5cqw;padding:2.7cqw 4.5cqw;font-size:9.4cqw;line-height:1.24;color:var(--dp);flex:1;overflow:hidden;overflow-wrap:break-word}
.txt p{margin:0 0 .2em}
.txt p:last-child{margin-bottom:0}
.bot{display:flex;justify-content:space-between;align-items:center;gap:3.6cqw;flex:none}
.rc{font-size:8.6cqw;font-weight:600;letter-spacing:.02em;color:var(--lt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:1.8cqw}
.pw{flex:none;background:var(--dp);color:var(--lt);font-weight:700;font-size:11.2cqw;padding:0 6.2cqw;border-radius:3.6cqw;line-height:1.5}
.card.multicolor{background:linear-gradient(135deg,var(--fr) 45%,var(--second) 55%)}
.card.multicolor .cost,.card.multicolor .pw{background:linear-gradient(135deg,var(--fr) 50%,var(--second) 50%);color:#fff;box-shadow:inset 0 0 0 1px #0004}
.card.scan-only{padding:0;overflow:hidden}
.card.scan-only>img{display:block;width:100%;height:100%;object-fit:fill;border-radius:inherit}
.scan-card{display:block;width:250px;max-width:100%;height:auto;flex:none;margin:0 auto;border-radius:10px}
.collection-tools{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin:16px 0}
.collection-tools .fld:first-child{flex:1 1 230px}
.collection-tools .fld{flex:1 1 140px}
.printed-rules{padding-left:18px;margin:0;display:grid;gap:9px;line-height:1.5}
.printed-rules .reminder{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:2px}
.flavor{margin:0;padding:2px 0 2px 12px;border-left:3px solid var(--line);color:var(--muted);font-style:italic;line-height:1.5}
.collection-note{color:var(--muted);font-size:13px;line-height:1.5}
.card.isevo::before{content:"";position:absolute;inset:1.3cqw;border:1.3cqw solid var(--lt);border-radius:inherit;pointer-events:none;opacity:.75}
.card.legend::after{content:"";position:absolute;inset:0;border:1.8cqw solid #EF9F27;border-radius:inherit;pointer-events:none}
.card.tapped{transform:rotate(9deg);opacity:.62}
.tag{position:absolute;left:2.7cqw;bottom:1.8cqw;max-width:48%;font-size:8cqw;letter-spacing:.02em;font-weight:700;background:var(--ink);color:var(--bg);padding:0 3.6cqw;border-radius:2.7cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.under{left:auto;right:2.7cqw;background:var(--dp);color:var(--lt)}
.card.can{box-shadow:0 0 0 3px var(--hi)}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--hi)}
.card.target{box-shadow:0 0 0 3px var(--danger)}
/* the attack in progress: attacker, what it attacks, and the blocker */
.card.attacking{box-shadow:0 0 0 3px #EF9F27,0 0 14px #EF9F27aa}
.card.attacked{box-shadow:0 0 0 3px var(--danger),0 0 14px #c8321f88}
.card.blocking{box-shadow:0 0 0 3px var(--hi),0 0 14px #1e6fd988}
/* the action bar stays on screen while you scroll the board (sticky to whichever edge it would leave) */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 4px;min-height:58px;position:sticky;top:0;bottom:0;z-index:4;background:var(--bg)}
/* End turn closes the row, set apart from the step's own actions */
.bar .endturn{margin-left:6px}
.bar .prompt+.endturn,.bar .turn+.endturn{margin-left:auto}
/* the game menu and sound switch, top right of the board */
.sys{margin-left:auto;display:inline-flex;gap:6px}
button.icon{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;color:var(--muted)}
button.icon:hover{color:var(--ink)}
button.icon svg{width:19px;height:19px}
.step{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.prompt{color:var(--muted);flex:1;min-width:160px}
.turn{font-weight:700;font-size:16px;letter-spacing:.02em;padding:3px 14px;border-radius:999px;background:var(--ink);color:var(--bg)}
.log{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.6;padding:8px 14px;background:var(--mat);border-radius:14px;box-shadow:inset 0 0 0 1px var(--frame)}
.log summary{cursor:pointer;font-weight:700;color:var(--ink);width:max-content}
.log>div{max-height:150px;overflow:auto;margin-top:4px}
.log>div>div:first-child{color:var(--ink)}
.cref{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.cref:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.dialog{background:var(--panel);border-radius:20px;padding:24px;max-width:520px;width:100%;display:grid;gap:12px;box-shadow:inset 0 0 0 1px var(--frame),var(--shadow)}
.dialog h2{margin:0;font-size:25px}
.dialog p{margin:0;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:8px}
/* the start screen wears the logo's frame: fire and water, like a multicolored card */
#start .dialog{max-width:680px;border:4px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(135deg,#A32D2D 45%,#185FA5 55%) border-box;box-shadow:var(--shadow)}
#start h1{margin:0;font-size:46px;font-weight:750;letter-spacing:-.025em;line-height:1}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
/* deck tiles are small card frames: their civilizations' colors, light plates with deep text */
.deck,.mydeck{text-align:left;display:grid;align-content:start;gap:5px;padding:5px;border-radius:14px/12px;background:var(--fr);color:var(--dp);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s}
.deck:hover{background:var(--fr);transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.28)}
.dplate{display:flex;align-items:center;gap:8px;background:var(--lt);border-radius:9px;padding:5px 9px;min-height:32px}
.dplate b{color:var(--dp);line-height:1.15}
.deck small,.mydeck small{background:var(--lt);color:var(--dp);border-radius:9px;padding:6px 9px;line-height:1.38;font-weight:500;opacity:.94}
.deck.blank{--fr:var(--frame);--lt:var(--face);--dp:var(--ink)}
.dots{display:flex;gap:3px;flex:none}
.dots span{width:15px;height:15px;border-radius:50%;background:var(--el);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.dots:has(span:nth-child(4)) span{width:11px;height:11px}
.rules{color:var(--muted);line-height:1.55;font-size:13.5px;margin:0}
/* The builder header is a full-width band on its own layer, so cards scrolling under it never show at its edges. */
.bh{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:calc(-1*var(--pad));padding:14px 0 10px;border-bottom:1px solid var(--frame);
  box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);will-change:transform}
.bh h2{margin:0 8px 0 0;font-size:26px}
.cnt{font-weight:700;margin-right:auto;font-size:20px}
.cnt.ok{color:var(--ok)}
.bmsg{color:var(--muted);font-size:13px;width:100%}
.civ h3{margin:18px 0 8px;font-size:20px;color:var(--el)}
/* rows are swapped in and out while scrolling; the browser must not nudge the scroll position for that */
.bgrid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px;overflow-anchor:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
/* the selected civilization tab is filled with its frame color */
.tabs button.main{background:var(--tab);color:#fff}
.tabs button.main.all{color:var(--bg)}
.tabs button.main .tdot{background:currentColor}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--el);margin-right:6px}
.bitem{position:relative;display:grid;gap:5px;justify-items:center}
/* cards in your deck: a ring, a copy badge on the corner, and a highlighted count */
.bitem.indeck .card{box-shadow:0 0 0 3px var(--ink)}
.qb{display:none;position:absolute;left:2.7cqw;top:1.8cqw;font:700 10cqw/1.25 var(--font-num);background:var(--ink);color:var(--bg);padding:0 4cqw;border-radius:2.7cqw;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.bitem.indeck .qb{display:block}
.bitem.indeck .bc span{background:var(--ink);color:var(--bg);border-radius:999px;min-width:24px;font-family:var(--font-num);font-size:15px;line-height:22px}
.build-tools{margin:12px 0 4px}
.build-tools .check{display:flex;gap:9px;align-items:center;align-self:end;padding-bottom:9px;font-size:13px;color:var(--ink);cursor:pointer}
.deck-summary{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;background:var(--mat);border-radius:16px;padding:12px 16px;margin:10px 0;box-shadow:inset 0 0 0 1px var(--frame)}
.curve{display:flex;gap:6px;height:76px}
.curve div{width:22px;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;font-size:11px}
.curve span{align-self:end;width:100%;min-height:2px;border-radius:3px 3px 0 0;background:var(--hi)}
.curve small{color:var(--muted)}
.dstats{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 300px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--panel);font-size:12.5px}
.dwarn{width:100%;margin:0;padding-left:18px;color:var(--danger);font-size:13px;line-height:1.5}
.bc{display:flex;gap:6px;align-items:center}
.bc button{padding:2px 10px}
.bc span{min-width:16px;text-align:center;font-weight:700}
@media (max-width:600px){
  .shields .back{width:20px;height:28px;font-size:10px}.shields{gap:3px}
  .bar{padding:6px 2px;min-height:0;gap:6px}.bar button{padding:6px 10px}
  .prompt{font-size:13px;min-width:120px}
  .tcard{zoom:.78}.tvis{padding:12px 8px}
  .card{width:86px}
  .zone{min-height:150px;padding:6px;gap:6px}
  #start h1{font-size:34px}
}
/* phones held sideways: little height, so smaller cards and a tighter board */
@media (orientation:landscape) and (max-height:500px){
  #app{--pad:4px}
  .card{width:78px}
  .zone{min-height:124px;gap:6px}
  .side{padding:6px 8px;gap:5px}
  .bar{padding:4px 2px;min-height:0;gap:6px}.bar button{padding:5px 10px}
  .shields .back{width:20px;height:28px;font-size:10px}
  .mana{width:19px;height:19px;font-size:10px}
}
/* text that still doesn't fit at the smallest readable size fades out; tap the card to read it all */
.txt.clipped{-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}


/* zoomed card view */
#zoom .overlay{z-index:20}
/* browsing cards and changing copies from the zoom view */
.znav{display:flex;align-items:center;gap:10px;font-family:var(--font-num);font-size:16px;color:var(--muted)}
.znav button.icon{font-size:24px;line-height:1}
.zqty{display:flex;align-items:center;gap:10px;background:var(--mat);border-radius:999px;padding:5px 14px 5px 6px;box-shadow:inset 0 0 0 1px var(--frame);width:max-content}
.zqty button{width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.zqty b{font-family:var(--font-num);font-size:26px;min-width:18px;text-align:center}
.zqty span{font-size:12.5px;color:var(--muted);line-height:1.2}
.zqty small{font-family:var(--font-num);font-size:14px}
.zqty small.ok{color:var(--ok)}
.card.flash{animation:k-flash 1.2s ease-out}
@keyframes k-flash{0%,40%{box-shadow:0 0 0 4px #EF9F27,0 0 18px #EF9F27aa}100%{box-shadow:0 0 0 0 transparent}}
.pilebox{max-width:860px;display:block}
.pilebox h2{margin:0 40px 12px 0;font-size:22px}
.pile{display:flex;flex-wrap:wrap;gap:10px;max-height:62vh;overflow:auto;padding:4px}
.pitem{display:grid;gap:3px;justify-items:center;cursor:pointer}
.pitem small{color:var(--muted);font-size:11.5px}
.zbox{background:var(--panel);box-shadow:inset 0 0 0 1px var(--frame),var(--shadow);border-radius:20px;padding:18px;max-width:640px;width:100%;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;position:relative}
.zinfo{flex:1;min-width:220px;display:grid;gap:10px}
.zinfo h2{margin:0;font-size:24px;line-height:1.15;padding-right:36px}
.zinfo p{margin:0;line-height:1.5}
.zmeta{color:var(--muted)}
.kw{display:grid;gap:8px}
.kw div{line-height:1.45;font-size:13.5px}
.kw b{display:block}
.zclose{position:absolute;right:12px;top:12px;width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;line-height:1}
.card.big{width:250px;border-radius:16px;cursor:default;margin:0 auto}
.card.big .cbody{padding:8px;gap:6px}
.card.big .nbar{min-height:50px;padding:4px 8px;border-radius:9px;gap:8px}
.card.big .cost{width:36px;height:36px;font-size:23px}
.card.big .nm{font-size:21px;-webkit-line-clamp:3}
.card.big .art{height:140px;border-radius:9px}
.card.big .rc{font-size:15px;padding-left:4px}
.card.big .trg{font-size:12px;padding:1px 7px;right:6px;top:5px;border-radius:5px}
.card.big .tag{font-size:12px;padding:1px 7px;left:6px;bottom:5px;border-radius:5px}
.card.big .tag.under{left:auto;right:6px}
.card.big .txt{font-size:15.5px;line-height:1.4;padding:8px 10px;border-radius:9px}
.card.big .pw{font-size:22px;padding:1px 12px;border-radius:7px}
.card.big.legend::after{border-width:3px}
.card.big.isevo::before{border-radius:14px;inset:3px;border-width:2px}
.zoomwrap .art *,.dialog .art *{animation-play-state:running}
.dcard{display:flex;justify-content:center}
.hint{color:var(--muted);font-size:12.5px}
.tut{max-width:820px!important}
.thead{display:flex;align-items:center;gap:10px}
.tstep{color:var(--muted);font-size:13px;margin-right:auto}
.tclose{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;line-height:1}
.tut h2{font-size:26px}
.tbody{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.tvis{flex:1 1 320px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:220px;background:var(--mat);border-radius:12px;padding:16px;position:relative}
.ttxt{flex:1 1 260px;display:grid;gap:10px}
.ttxt p{margin:0;line-height:1.55}
.ttxt ol{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.5}
.tkey{display:grid;gap:6px}
.tkey div{display:flex;gap:8px;align-items:baseline;line-height:1.45}
.mk{width:22px;height:22px;flex:none;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;display:inline-grid;place-items:center}
.tvis .mk{position:absolute;transform:translate(-50%,-50%);z-index:4;box-shadow:0 0 0 2px var(--mat)}
.tcard{position:relative;margin:0 14px}
.arrow{font-size:26px;color:var(--muted);font-weight:700}
.tcap{font-size:12.5px;color:var(--muted);text-align:center;max-width:120px;line-height:1.35}
.tcol{display:grid;gap:6px;justify-items:center}
.tnav{display:flex;align-items:center;gap:10px}
.tdots{display:flex;flex-wrap:wrap;gap:6px;margin:0 auto;justify-content:center}
.tdots button{width:11px;height:11px;padding:0;border-radius:50%;background:var(--line);border:none}
.tdots button.on{background:var(--ink)}
.tshields{display:flex;flex-wrap:wrap;gap:4px;max-width:180px;justify-content:center}
.back.gone{opacity:.25}
.tnote{font-size:13px;color:var(--muted)}
.dname{font:inherit;font-weight:700;font-size:15px;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--face);color:var(--ink);width:190px}
.dname:focus{outline:3px solid var(--hi);outline-offset:1px}
.bsaved{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.mdb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:2px 2px 1px}
.mydeck{position:relative}
.dconfirm{position:absolute;inset:0;border-radius:inherit;background:var(--panel);box-shadow:inset 0 0 0 2px var(--danger);display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;color:var(--ink);animation:k-fade .15s ease-out}
button.danger{background:var(--danger);color:#fff;box-shadow:none}
button.danger:hover{background:var(--danger);box-shadow:0 0 0 3px var(--frame)}
@keyframes k-fade{from{opacity:0}}
.mdb button{padding:4px 10px}
#mydecks{display:grid;gap:8px}
.seg{display:inline-flex;background:var(--face);border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1.5px var(--line)}.seg button{padding:5px 15px;box-shadow:none;background:none}.seg button.main{background:var(--ink)}
.fld{display:grid;gap:4px}
.fld span{font-size:13px;color:var(--muted)}
.fld input,.fld select{font:inherit;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--face);color:var(--ink)}
.fld input:focus,.fld select:focus{outline:3px solid var(--hi);outline-offset:1px}
/* custom dropdown: a pill like the inputs, with a floating list */
.dd{position:relative}
.ddbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font-weight:500;padding:10px 12px;border-radius:10px;background:var(--face);box-shadow:inset 0 0 0 1.5px var(--line)}
.ddbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddbtn svg{width:12px;height:8px;flex:none;color:var(--muted);transition:transform .15s}
.ddbtn[aria-expanded="true"]{box-shadow:inset 0 0 0 1.5px var(--hi)}
.ddbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.ddlist{position:absolute;z-index:30;left:0;min-width:100%;width:max-content;max-width:min(360px,92vw);top:calc(100% + 6px);max-height:300px;overflow:auto;background:var(--panel);border-radius:12px;padding:5px;box-shadow:inset 0 0 0 1px var(--frame),var(--shadow);animation:k-drop .12s ease-out}
.dd.up .ddlist{top:auto;bottom:calc(100% + 6px)}
.ddopt{padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddopt:hover,.ddopt:focus{background:var(--mat);outline:none}
.ddopt[aria-selected="true"]{font-weight:700}
.ddopt[aria-selected="true"]::after{content:"✓";float:right;margin-left:10px;color:var(--muted)}
@keyframes k-drop{from{opacity:0;transform:translateY(-4px)}}
/* a checkbox shown as a switch */
input.switch{appearance:none;-webkit-appearance:none;margin:0;width:38px;height:22px;flex:none;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
input.switch::before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
input.switch:checked{background:var(--ok)}
input.switch:checked::before{transform:translateX(16px)}
input.switch:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#mpcode{text-transform:uppercase;letter-spacing:4px;width:120px}
.joinrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.code{font-size:52px;font-weight:700;letter-spacing:12px;margin:4px 0!important}
.err{color:var(--danger);font-weight:700}
.modesw{padding:10px 14px;border-radius:14px;background:var(--mat);box-shadow:inset 0 0 0 1px var(--frame)}
.modesw .hint{flex-basis:100%}
#start.friendmode .pickh::after{content:" to bring to the room"}
.logo{display:flex;align-items:center;gap:14px}
.logo .emblem{width:58px;height:64px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.logo h1{margin:0}
@media (max-width:600px){.logo .emblem{width:46px;height:51px}}
.credit{margin:6px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}
.howto{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* character and scene animation; loops share one clock (--ph) so re-renders don't restart them */
.art *{animation-play-state:paused;transform-box:fill-box}
.bzone .art *,.card:hover .art *,.card.sel .art *{animation-play-state:running}
.a-hover{animation:k-hover 2s ease-in-out infinite;animation-delay:var(--ph)}
.a-breathe{transform-origin:50% 100%;animation:k-breathe 2s ease-in-out infinite;animation-delay:var(--ph)}
.a-sway{transform-origin:50% 100%;animation:k-sway 4s ease-in-out infinite;animation-delay:var(--ph)}
.a-float{animation:k-float 4s ease-in-out infinite;animation-delay:var(--ph)}
.a-spin{transform-origin:50% 50%;animation:k-spin 8s linear infinite;animation-delay:var(--ph)}
.a-scuttle{animation:k-scuttle 2s steps(8) infinite;animation-delay:var(--ph)}
.a-pulse{transform-origin:50% 50%;animation:k-pulse 2s ease-in-out infinite;animation-delay:var(--ph)}
.wl{transform-origin:100% 80%;animation:k-flapl 1s ease-in-out infinite;animation-delay:var(--ph)}
.wr{transform-origin:0% 80%;animation:k-flapr 1s ease-in-out infinite;animation-delay:var(--ph)}
.wu{transform-origin:60% 100%;animation:k-flapu 1s ease-in-out infinite;animation-delay:var(--ph)}
.ring{transform-origin:50% 50%;animation:k-spin 8s linear infinite;animation-delay:var(--ph)}
.eye{animation:k-blink 4s infinite;animation-delay:var(--ph)}
.p-ember{animation:k-rise 2s ease-out infinite}
.p-bubble{animation:k-bubble 4s ease-in infinite}
.p-wave{animation:k-wave 4s ease-in-out infinite}
.p-tree{transform-origin:50% 100%;animation:k-sway 4s ease-in-out infinite}
.p-leaf{animation:k-leaf 4s linear infinite}
.p-rays,.p-burst{animation:k-glow 4s ease-in-out infinite;animation-delay:var(--ph)}
.p-glow{transform-origin:50% 50%;animation:k-aura 2s ease-in-out infinite;animation-delay:var(--ph)}
.p-twinkle{animation:k-twinkle 2s ease-in-out infinite}
.p-mist{animation:k-mist 8s ease-in-out infinite}
@keyframes k-hover{50%{transform:translateY(-2.5px)}}
@keyframes k-breathe{50%{transform:scale(1.03,1.05)}}
@keyframes k-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes k-float{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-3px);opacity:.75}}
@keyframes k-spin{to{transform:rotate(360deg)}}
@keyframes k-scuttle{0%,100%{transform:translateX(0)}25%{transform:translateX(1.5px)}75%{transform:translateX(-1.5px)}}
@keyframes k-pulse{50%{transform:scale(1.12)}}
@keyframes k-flapl{50%{transform:rotate(16deg) scaleY(.85)}}
@keyframes k-flapr{50%{transform:rotate(-16deg) scaleY(.85)}}
@keyframes k-flapu{50%{transform:rotate(-12deg) scaleY(.85)}}
@keyframes k-blink{0%,93%,100%{opacity:1}96%{opacity:0}}
@keyframes k-rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
@keyframes k-bubble{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
@keyframes k-wave{50%{transform:translateX(-6px)}}
@keyframes k-leaf{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-14px,30px) rotate(200deg);opacity:0}}
@keyframes k-glow{50%{opacity:.45}}
@keyframes k-aura{50%{transform:scale(1.08);opacity:.25}}
@keyframes k-twinkle{50%{opacity:.15}}
@keyframes k-mist{50%{transform:translateX(9px)}}
/* action animations */
.card.fx-enter{animation:k-enter .55s ease-out both;animation-delay:var(--fxd)}
.card.fx-up{animation:k-up .45s ease-in-out both;animation-delay:var(--fxd);z-index:3}
.card.fx-down{animation:k-down .45s ease-in-out both;animation-delay:var(--fxd);z-index:3}
.card.fx-hit{animation:k-hit .35s ease-in-out both;animation-delay:var(--fxd)}
.card.fx-die{animation:k-die .45s ease-in both;animation-delay:var(--fxd)}
.back.shatter{animation:k-shatter .45s ease-in both}
@keyframes k-enter{0%{transform:scale(.4) translateY(30px);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:none}}
@keyframes k-up{40%{transform:translateY(-34px) scale(1.08)}}
@keyframes k-down{40%{transform:translateY(34px) scale(1.08)}}
@keyframes k-hit{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes k-die{to{transform:scale(.6) rotate(-10deg);opacity:0;filter:grayscale(1)}}
@keyframes k-shatter{50%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(.2) rotate(-25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.card{transition:none}*,*::before,*::after{animation:none!important}}
</style>
