<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shield Clash</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20110%22%3E%20%3Cdefs%3E%20%3CclipPath%20id%3D%22sc-shield%22%3E%3Cpath%20d%3D%22M50%205%20L91%2018%20L87%2061%20C83%2083%2068%2097%2050%20105%20C32%2097%2017%2083%2013%2061%20L9%2018%20Z%22/%3E%3C/clipPath%3E%20%3C/defs%3E%20%3Cg%20clip-path%3D%22url%28%23sc-shield%29%22%3E%20%3Crect%20width%3D%22100%22%20height%3D%22110%22%20fill%3D%22%23185FA5%22/%3E%20%3Cpath%20d%3D%22M0%200%20L50%200%20L44%2030%20L57%2046%20L42%2064%20L55%2080%20L47%20110%20L0%20110%20Z%22%20fill%3D%22%23A32D2D%22/%3E%20%3Cpath%20d%3D%22M0%200%20L50%200%20L44%2030%20L20%2040%20L0%2034%20Z%22%20fill%3D%22%23C8463F%22%20opacity%3D%22.55%22/%3E%20%3Cpath%20d%3D%22M100%200%20L50%200%20L57%2046%20L82%2050%20L100%2040%20Z%22%20fill%3D%22%232E78C0%22%20opacity%3D%22.55%22/%3E%20%3C/g%3E%20%3Cpath%20d%3D%22M50%2014%20L82%2024%20L79%2060%20C76%2077%2065%2088%2050%2095%20C35%2088%2024%2077%2021%2060%20L18%2024%20Z%22%20fill%3D%22none%22%20stroke%3D%22%23FCEBEB%22%20stroke-opacity%3D%22.55%22%20stroke-width%3D%222%22/%3E%20%3Cpath%20d%3D%22M50%206%20L44%2030%20L57%2046%20L42%2064%20L55%2080%20L48%20104%22%20fill%3D%22none%22%20stroke%3D%22%23FAC775%22%20stroke-width%3D%225%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22/%3E%20%3Cpath%20d%3D%22M50%206%20L44%2030%20L57%2046%20L42%2064%20L55%2080%20L48%20104%22%20fill%3D%22none%22%20stroke%3D%22%23FFF6E0%22%20stroke-width%3D%221.6%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22/%3E%20%3Cpath%20d%3D%22M50%2046%20L54%2041%20L56%2047%20L63%2046%20L58%2051%20L62%2057%20L55%2055%20L52%2062%20L49%2055%20L42%2057%20L46%2051%20L41%2046%20L48%2047%20Z%22%20fill%3D%22%23FAC775%22%20stroke%3D%22%23FFF6E0%22%20stroke-width%3D%221%22/%3E%20%3Cpath%20d%3D%22M50%205%20L91%2018%20L87%2061%20C83%2083%2068%2097%2050%20105%20C32%2097%2017%2083%2013%2061%20L9%2018%20Z%22%20fill%3D%22none%22%20stroke%3D%22%231a2128%22%20stroke-width%3D%224%22%20stroke-linejoin%3D%22round%22/%3E%20%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#1e252f">
<style>
:root{
  --bg:#dfe5ea;--mat:#cbd5de;--panel:#f3f6f8;--ink:#1a2128;--muted:#5d6975;--line:#a9b6c2;
  --face:#fbfcfd;--back:#33405a;--back2:#4a5a7c;--hi:#1e6fd9;--danger:#c8321f;--ok:#2e8b46;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161c;--mat:#1a2029;--panel:#1e252f;--ink:#e6ebf0;--muted:#94a0ad;--line:#36414e;
    --face:#232b36;--back:#5a6b94;--back2:#3d4a68;--hi:#6aa5ff;--danger:#ff6b55;--ok:#5fcf7b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:14px}
button{font:inherit;cursor:pointer;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:6px}
button:hover{background:var(--mat)}
button:disabled{opacity:.4;cursor:not-allowed}
button.main{background:var(--ink);color:var(--bg)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#app{max-width:1100px;margin:0 auto;padding:10px}
.side{background:var(--mat);border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.info{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;color:var(--muted)}
.info b{color:var(--ink);font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.stack{display:grid;gap:6px;justify-items:start}
.stack .lbl{min-width:64px}
.zone{display:flex;flex-wrap:wrap;gap:8px;min-height:180px;align-items:flex-start}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.shields{display:flex;gap:4px;align-items:center}
.back{width:30px;height:42px;border-radius:4px;background:repeating-linear-gradient(45deg,var(--back) 0 6px,var(--back2) 6px 12px);border:1.5px solid var(--ink)}
.lbl{color:var(--muted);font-size:12px;margin-right:4px}
.manas{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.mana{width:22px;height:22px;border-radius:50%;background:var(--el);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:1.5px solid var(--ink)}
.mana.used{opacity:.3}
/* Card layout from the 112px design, in container units so every display size keeps its proportions. */
.card{position:relative;container-type:inline-size;width:112px;aspect-ratio:112/174;flex:none;border-radius:8%/5.2%;background:var(--fr);cursor:pointer;transition:transform .15s}
.cbody{height:100%;box-sizing:border-box;padding:3.6cqw;display:flex;flex-direction:column;gap:2.7cqw}
.nbar{display:flex;gap:3.6cqw;align-items:center;background:var(--lt);border-radius:4.5cqw;padding:1.8cqw 3.6cqw;min-height:23cqw;flex:none}
.cost{flex:none;width:17cqw;height:17cqw;border-radius:50%;background:var(--dp);color:var(--lt);font-weight:700;font-size:10.3cqw;display:grid;place-items:center}
.nm{min-width:0;font-weight:700;font-size:9.4cqw;line-height:1.12;color:var(--dp);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.art{position:relative;height:50cqw;flex:none;border-radius:4.5cqw;overflow:hidden;background:var(--md)}
.art svg{display:block;width:100%;height:100%}
.art img{display:block;width:100%;height:100%;object-fit:cover}
.missing-art{height:100%;display:grid;place-items:center;text-align:center;padding:10%;font-size:7cqw;color:var(--dp);background:var(--lt)}
.trg{position:absolute;right:2.7cqw;top:1.8cqw;font-size:7.1cqw;font-weight:700;background:var(--dp);color:var(--lt);padding:0 3.6cqw;border-radius:2.7cqw}
.txt{min-height:0;background:var(--lt);border-radius:4.5cqw;padding:2.7cqw 4.5cqw;font-size:8.5cqw;line-height:1.28;color:var(--dp);flex:1;overflow:hidden;overflow-wrap:break-word}
.txt p{margin:0 0 .2em}
.txt p:last-child{margin-bottom:0}
.txt em{font-style:italic;opacity:.8}
.bot{display:flex;justify-content:space-between;align-items:center;gap:3.6cqw;flex:none}
.rc{font-size:7.6cqw;font-weight:700;color:var(--lt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:1.8cqw}
.pw{flex:none;background:var(--dp);color:var(--lt);font-weight:700;font-size:9.8cqw;padding:0 6.2cqw;border-radius:3.6cqw;line-height:1.5}
.card.multicolor{background:linear-gradient(135deg,var(--fr) 45%,var(--second) 55%)}
.printed-rules{padding-left:18px;margin:0;display:grid;gap:9px;line-height:1.5}
.card.isevo::before{content:"";position:absolute;inset:1.3cqw;border:1.3cqw solid var(--lt);border-radius:inherit;pointer-events:none;opacity:.75}
.card.legend::after{content:"";position:absolute;inset:0;border:1.8cqw solid #EF9F27;border-radius:inherit;pointer-events:none}
.card.tapped{transform:rotate(9deg);opacity:.62}
.tag{position:absolute;left:6.2cqw;top:57cqw;max-width:85%;font-size:7.6cqw;font-weight:700;background:var(--ink);color:var(--bg);padding:0 3.6cqw;border-radius:2.7cqw;z-index:1}
.card.can{box-shadow:0 0 0 3px var(--hi)}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--hi)}
.card.target{box-shadow:0 0 0 3px var(--danger)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 4px;min-height:58px}
.prompt{color:var(--muted);flex:1;min-width:160px}
.turn{font-weight:700;padding:4px 10px;border-radius:20px;border:1.5px solid var(--ink)}
.log{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.6;max-height:150px;overflow:auto;padding:6px 4px}
.log div:first-child{color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.dialog{background:var(--panel);border-radius:14px;padding:22px;max-width:520px;width:100%;display:grid;gap:12px;border:1.5px solid var(--ink)}
.dialog h2{margin:0;font-family:"Palatino Linotype",Palatino,Georgia,serif;font-size:24px}
.dialog p{margin:0;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:8px}
#start .dialog{max-width:680px}
#start h1{margin:0;font-family:"Palatino Linotype",Palatino,Georgia,serif;font-size:44px;letter-spacing:-.5px;line-height:1}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.deck{text-align:left;display:grid;gap:4px;padding:10px 12px}
.deck small{color:var(--muted)}
.dots{display:flex;gap:4px}
.dots span{width:14px;height:14px;border-radius:50%;background:var(--el)}
.rules{color:var(--muted);line-height:1.55;font-size:13.5px;margin:0}
.bh{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1.5px solid var(--line)}
.bh h2{margin:0 8px 0 0;font-family:"Palatino Linotype",Palatino,Georgia,serif;font-size:26px}
.cnt{font-weight:700;margin-right:auto;font-size:16px}
.cnt.ok{color:var(--ok)}
.bmsg{color:var(--muted);font-size:13px;width:100%}
.civ h3{margin:18px 0 8px;font-family:"Palatino Linotype",Palatino,Georgia,serif;font-size:20px;color:var(--el)}
.bgrid{display:flex;flex-wrap:wrap;gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--el);margin-right:6px}
.bitem{display:grid;gap:5px;justify-items:center}
.bc{display:flex;gap:6px;align-items:center}
.bc button{padding:2px 10px}
.bc span{min-width:16px;text-align:center;font-weight:700}
@media (max-width:600px){
  .shields .back{width:20px;height:28px}.shields{gap:3px}
  .tcard{zoom:.78}.tvis{padding:12px 8px}
  .card{width:86px}
  .zone{min-height:142px}
  #start h1{font-size:34px}
}


/* zoomed card view */
#zoom .overlay{z-index:20}
.zbox{background:var(--panel);border:1.5px solid var(--ink);border-radius:16px;padding:18px;max-width:640px;width:100%;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;position:relative}
.zinfo{flex:1;min-width:220px;display:grid;gap:10px}
.zinfo h2{margin:0;font-family:"Palatino Linotype",Palatino,Georgia,serif;font-size:24px;line-height:1.15;padding-right:36px}
.zinfo p{margin:0;line-height:1.5}
.zmeta{color:var(--muted)}
.kw{display:grid;gap:8px}
.kw div{line-height:1.45;font-size:13.5px}
.kw b{display:block}
.zclose{position:absolute;right:12px;top:12px;width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;line-height:1}
.card.big{width:250px;border-radius:16px;cursor:default;margin:0 auto}
.card.big .cbody{padding:8px;gap:6px}
.card.big .nbar{min-height:50px;padding:4px 8px;border-radius:9px;gap:8px}
.card.big .cost{width:36px;height:36px;font-size:20px}
.card.big .nm{font-size:17px;-webkit-line-clamp:3}
.card.big .art{height:140px;border-radius:9px}
.card.big .rc{font-size:13px;padding-left:4px}
.card.big .trg{font-size:12px;padding:1px 7px;right:6px;top:5px;border-radius:5px}
.card.big .txt{font-size:13.5px;line-height:1.4;padding:8px 10px;border-radius:9px}
.card.big .pw{font-size:19px;padding:2px 12px;border-radius:7px}
.card.big.legend::after{border-width:3px}
.card.big.isevo::before{border-radius:14px;inset:3px;border-width:2px}
.zoomwrap .art *,.dialog .art *{animation-play-state:running}
.dcard{display:flex;justify-content:center}
.hint{color:var(--muted);font-size:12.5px}
.tut{max-width:820px!important}
.thead{display:flex;align-items:center;gap:10px}
.tstep{color:var(--muted);font-size:13px;margin-right:auto}
.tclose{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;line-height:1}
.tut h2{font-size:26px}
.tbody{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.tvis{flex:1 1 320px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:220px;background:var(--mat);border-radius:12px;padding:16px;position:relative}
.ttxt{flex:1 1 260px;display:grid;gap:10px}
.ttxt p{margin:0;line-height:1.55}
.ttxt ol{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.5}
.tkey{display:grid;gap:6px}
.tkey div{display:flex;gap:8px;align-items:baseline;line-height:1.45}
.mk{width:22px;height:22px;flex:none;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;display:inline-grid;place-items:center}
.tvis .mk{position:absolute;transform:translate(-50%,-50%);z-index:4;box-shadow:0 0 0 2px var(--mat)}
.tcard{position:relative;margin:0 14px}
.arrow{font-size:26px;color:var(--muted);font-weight:700}
.tcap{font-size:12.5px;color:var(--muted);text-align:center;max-width:120px;line-height:1.35}
.tcol{display:grid;gap:6px;justify-items:center}
.tnav{display:flex;align-items:center;gap:10px}
.tdots{display:flex;flex-wrap:wrap;gap:6px;margin:0 auto;justify-content:center}
.tdots button{width:11px;height:11px;padding:0;border-radius:50%;background:var(--line);border:none}
.tdots button.on{background:var(--ink)}
.tshields{display:flex;flex-wrap:wrap;gap:4px;max-width:180px;justify-content:center}
.back.gone{opacity:.25}
.tnote{font-size:13px;color:var(--muted)}
.dname{font:inherit;font-weight:700;font-size:15px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:180px}
.dname:focus{outline:3px solid var(--hi);outline-offset:1px}
.bsaved{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.mydeck{display:grid;gap:5px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:6px;background:var(--panel)}
.mydeck small{color:var(--muted);line-height:1.4}
.mdb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.mdb button{padding:4px 10px}
#mydecks{display:grid;gap:8px}
.seg{display:inline-flex}.seg button{border-radius:0;padding:5px 14px}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;margin-left:-1.5px}
.fld{display:grid;gap:4px}
.fld span{font-size:13px;color:var(--muted)}
.fld input,.fld select{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.fld input:focus,.fld select:focus{outline:3px solid var(--hi);outline-offset:1px}
#mpcode{text-transform:uppercase;letter-spacing:4px;width:120px}
.joinrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.code{font-size:44px;font-weight:700;letter-spacing:10px;font-family:ui-monospace,Menlo,monospace;margin:4px 0!important}
.err{color:var(--danger);font-weight:700}
.modesw{padding:10px 12px;border-radius:10px;background:var(--mat)}
.modesw .hint{flex-basis:100%}
#start.friendmode .pickh::after{content:" to bring to the room"}
.logo{display:flex;align-items:center;gap:14px}
.logo .emblem{width:58px;height:64px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.logo h1{margin:0}
@media (max-width:600px){.logo .emblem{width:46px;height:51px}}
.credit{margin:6px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}
.howto{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* character and scene animation; loops share one clock (--ph) so re-renders don't restart them */
.art *{animation-play-state:paused;transform-box:fill-box}
.bzone .art *,.card:hover .art *,.card.sel .art *{animation-play-state:running}
.a-hover{animation:k-hover 2s ease-in-out infinite;animation-delay:var(--ph)}
.a-breathe{transform-origin:50% 100%;animation:k-breathe 2s ease-in-out infinite;animation-delay:var(--ph)}
.a-sway{transform-origin:50% 100%;animation:k-sway 4s ease-in-out infinite;animation-delay:var(--ph)}
.a-float{animation:k-float 4s ease-in-out infinite;animation-delay:var(--ph)}
.a-spin{transform-origin:50% 50%;animation:k-spin 8s linear infinite;animation-delay:var(--ph)}
.a-scuttle{animation:k-scuttle 2s steps(8) infinite;animation-delay:var(--ph)}
.a-pulse{transform-origin:50% 50%;animation:k-pulse 2s ease-in-out infinite;animation-delay:var(--ph)}
.wl{transform-origin:100% 80%;animation:k-flapl 1s ease-in-out infinite;animation-delay:var(--ph)}
.wr{transform-origin:0% 80%;animation:k-flapr 1s ease-in-out infinite;animation-delay:var(--ph)}
.wu{transform-origin:60% 100%;animation:k-flapu 1s ease-in-out infinite;animation-delay:var(--ph)}
.ring{transform-origin:50% 50%;animation:k-spin 8s linear infinite;animation-delay:var(--ph)}
.eye{animation:k-blink 4s infinite;animation-delay:var(--ph)}
.p-ember{animation:k-rise 2s ease-out infinite}
.p-bubble{animation:k-bubble 4s ease-in infinite}
.p-wave{animation:k-wave 4s ease-in-out infinite}
.p-tree{transform-origin:50% 100%;animation:k-sway 4s ease-in-out infinite}
.p-leaf{animation:k-leaf 4s linear infinite}
.p-rays,.p-burst{animation:k-glow 4s ease-in-out infinite;animation-delay:var(--ph)}
.p-glow{transform-origin:50% 50%;animation:k-aura 2s ease-in-out infinite;animation-delay:var(--ph)}
.p-twinkle{animation:k-twinkle 2s ease-in-out infinite}
.p-mist{animation:k-mist 8s ease-in-out infinite}
@keyframes k-hover{50%{transform:translateY(-2.5px)}}
@keyframes k-breathe{50%{transform:scale(1.03,1.05)}}
@keyframes k-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes k-float{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-3px);opacity:.75}}
@keyframes k-spin{to{transform:rotate(360deg)}}
@keyframes k-scuttle{0%,100%{transform:translateX(0)}25%{transform:translateX(1.5px)}75%{transform:translateX(-1.5px)}}
@keyframes k-pulse{50%{transform:scale(1.12)}}
@keyframes k-flapl{50%{transform:rotate(16deg) scaleY(.85)}}
@keyframes k-flapr{50%{transform:rotate(-16deg) scaleY(.85)}}
@keyframes k-flapu{50%{transform:rotate(-12deg) scaleY(.85)}}
@keyframes k-blink{0%,93%,100%{opacity:1}96%{opacity:0}}
@keyframes k-rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
@keyframes k-bubble{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
@keyframes k-wave{50%{transform:translateX(-6px)}}
@keyframes k-leaf{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-14px,30px) rotate(200deg);opacity:0}}
@keyframes k-glow{50%{opacity:.45}}
@keyframes k-aura{50%{transform:scale(1.08);opacity:.25}}
@keyframes k-twinkle{50%{opacity:.15}}
@keyframes k-mist{50%{transform:translateX(9px)}}
/* action animations */
.card.fx-enter{animation:k-enter .55s ease-out both;animation-delay:var(--fxd)}
.card.fx-up{animation:k-up .45s ease-in-out both;animation-delay:var(--fxd);z-index:3}
.card.fx-down{animation:k-down .45s ease-in-out both;animation-delay:var(--fxd);z-index:3}
.card.fx-hit{animation:k-hit .35s ease-in-out both;animation-delay:var(--fxd)}
.card.fx-die{animation:k-die .45s ease-in both;animation-delay:var(--fxd)}
.back.shatter{animation:k-shatter .45s ease-in both}
@keyframes k-enter{0%{transform:scale(.4) translateY(30px);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:none}}
@keyframes k-up{40%{transform:translateY(-34px) scale(1.08)}}
@keyframes k-down{40%{transform:translateY(34px) scale(1.08)}}
@keyframes k-hit{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes k-die{to{transform:scale(.6) rotate(-10deg);opacity:0;filter:grayscale(1)}}
@keyframes k-shatter{50%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(.2) rotate(-25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.card{transition:none}*,*::before,*::after{animation:none!important}}
</style>

<script src="card-catalog.js"></script>
<script>
// Inside the Claude app, window.storage is provided (personal + shared data).
// Anywhere else (GitHub Pages, a downloaded file) we keep decks in localStorage
// and connect two devices through a public MQTT relay for online play.
const IN_CLAUDE=!!(window.storage&&typeof window.storage.get==='function');
if(!IN_CLAUDE){
  const LS=(()=>{try{const t='__sc';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage}catch(e){return null}})();
  const mem={};
  const g=k=>LS?LS.getItem('sc:'+k):(k in mem?mem[k]:null),st=(k,v)=>{if(LS)LS.setItem('sc:'+k,v);else mem[k]=v},rm=k=>{if(LS)LS.removeItem('sc:'+k);else delete mem[k]};
  window.storage={
    async get(k){const v=g(k);if(v==null)throw new Error('Key not found');return {key:k,value:v,shared:false}},
    async set(k,v){st(k,v);return {key:k,value:v,shared:false}},
    async delete(k){rm(k);return {key:k,deleted:true,shared:false}},
    async list(prefix=''){const keys=[];if(LS){for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k.startsWith('sc:'+prefix))keys.push(k.slice(3))}}return {keys,prefix,shared:false}}
  };
}
const CIV={
  fire:{n:'Fire',c:'#A32D2D'},water:{n:'Water',c:'#185FA5'},nature:{n:'Nature',c:'#3B6D11'},
  light:{n:'Light',c:'#854F0B'},darkness:{n:'Dark',c:'#3C3489'}
};
/* ---------- card palette and civilization emblems ---------- */
const PAL={
  fire:{frame:'#A32D2D',light:'#FCEBEB',mid:'#F09595',deep:'#501313',soft:'#F7C1C1'},
  water:{frame:'#185FA5',light:'#E6F1FB',mid:'#85B7EB',deep:'#042C53',soft:'#B5D4F4'},
  nature:{frame:'#3B6D11',light:'#EAF3DE',mid:'#97C459',deep:'#173404',soft:'#C0DD97'},
  light:{frame:'#854F0B',light:'#FAEEDA',mid:'#FAC775',deep:'#412402',soft:'#FCE3B4'},
  darkness:{frame:'#3C3489',light:'#EEEDFE',mid:'#AFA9EC',deep:'#26215C',soft:'#CECBF6'},
  unknown:{frame:'#68717d',light:'#edf0f3',mid:'#bbc3cc',deep:'#29323d',soft:'#d5dbe1'}
};
const EMB={
 fire:'M20 3 C26 11 31 16 29 26 C28 33 23 37 20 37 C14 37 9 32 10 25 C11 19 15 17 16 11 C19 15 21 17 22 20 C23 15 22 9 20 3 Z',
 water:'M20 3 C26 13 31 20 31 26 C31 32 26 37 20 37 C14 37 9 32 9 26 C9 20 14 13 20 3 Z',
 nature:'M7 33 C7 16 18 6 35 6 C35 23 24 33 7 33 Z',
 light:'M20 11 a9 9 0 1 0 0.1 0 Z M20 0 L22 7 L18 7 Z M20 40 L22 33 L18 33 Z M0 20 L7 18 L7 22 Z M40 20 L33 18 L33 22 Z M6 6 L11 10 L10 11 Z M34 34 L29 30 L30 29 Z M34 6 L30 11 L29 10 Z M6 34 L10 29 L11 30 Z',
 darkness:'M28 6.1 A16 16 0 1 0 28 33.9 A14 14 0 0 1 28 6.1 Z'
};
const FXT={
  bounce:"Return an enemy creature to its owner's hand.",kill:'Destroy an enemy creature.',
  killTapped:'Destroy a tapped enemy creature.',
  ramp:'Put the top card of your deck into your mana zone.',ramp2:'Put the top 2 cards of your deck into your mana zone.',
  tapall:"Tap all your opponent's creatures.",tapone:'Tap an enemy creature.',
  draw:'Draw a card.',draw2:'Draw 2 cards.',draw3:'Draw 3 cards.',
  discard:'Your opponent discards a random card.',discard2:'Your opponent discards 2 random cards.',
  shieldadd:'Add the top card of your deck to your shields.',shield2:'Add the top 2 cards of your deck to your shields.',
  recover:'Return your best creature from your graveyard to your hand.',
  manaburn:"Put a random card from your opponent's mana zone into their graveyard."
};
const fxList=f=>f?(Array.isArray(f)?f:[f]):[];
function fxText(f){
  if(f.startsWith('optional:'))return 'You may '+fxText(f.slice(9)).replace(/^./,s=>s.toLowerCase());
  const up=/^drawUp(\d+)$/.exec(f);if(up)return `Draw up to ${up[1]} card${up[1]==='1'?'':'s'}.`;
  if(f==='draw1')return 'Draw a card.';
  if(f==='bounceAny')return "Return a creature to its owner's hand.";
  if(f==='killUntapped')return 'Destroy an untapped enemy creature.';
  if(f==='killBlocker')return 'Destroy an enemy blocker.';
  if(f==='discardAll')return 'Your opponent discards their hand.';
  if(f==='discardShield')return 'Put one of your shields into your graveyard without using its shield trigger.';
  const all=/^sweepAll(\d+)$/.exec(f);if(all)return `Destroy all creatures with ${all[1]} power or less.`;
  const m=/^(burn|sweep)(\d+)$/.exec(f);
  if(m)return m[1]==='burn'?`Destroy an enemy creature with ${m[2]} power or less.`:`Destroy all enemy creatures with ${m[2]} power or less.`;
  return FXT[f];
}
const fxDesc=f=>fxList(f).map(fxText).join(' ');
const CATALOG=makeCardCatalog(window.CARD_DATABASE);
const DEFS=CATALOG.filter(c=>c.playable&&c.duelId===c.id);
const DEF=Object.fromEntries(CATALOG.map(c=>[c.id,c]));
const archiveCivilization=c=>CIV[c.e]||{n:'Unspecified',c:'#68717d'};
const PRESETS=[
  {n:'Blazing roots',civ:['fire','nature'],d:'Ramp into huge attackers.'},
  {n:'Tidewall',civ:['water','light'],d:'Blockers, card draw, control.'},
  {n:'Ashen night',civ:['darkness','fire'],d:'Removal and fast pressure.'},
  {n:'Deep current',civ:['water','nature'],d:'Big mana, unblockable threats.'},
  {n:'Twilight',civ:['light','darkness'],d:'Hold the line, then strike.'},
  {n:'Wildfire',civ:['fire','water'],d:'Speed attackers and tricks.'},
];
// Presets pick a fresh mix each game: 10 cards per civilization, 2 copies each,
// with a sensible cost curve and evolutions only when their race is in the deck.
function presetIds(civ){
  const ids=[];
  for(const e of civ){
    const cs=shuffle(DEFS.filter(d=>d.e===e)),pick=[];
    const want=[[c=>c.cost<=2,5],[c=>c.cost>=3&&c.cost<=4,4],[c=>c.cost>=5,3]];
    for(const [f,n] of want){
      let got=0;
      for(const d of cs){
        if(got>=n)break;
        if(!f(d)||pick.includes(d))continue;
        if(d.evo&&!pick.some(x=>!x.evo&&x.race===d.evo))continue;
        pick.push(d);got++;
      }
    }
    for(const d of cs){
      if(pick.length>=12)break;
      if(pick.includes(d)||(d.evo&&!pick.some(x=>!x.evo&&x.race===d.evo)))continue;
      pick.push(d);
    }
    pick.forEach(d=>ids.push(d.id,d.id));
    const extra=pick.find(d=>d.cost<=2&&!d.evo)||pick[0];ids.push(extra.id);
  }
  return ids;
}

// Rank the actual cards by cost, power, and supported abilities.
function cardValue(d){
  let v=d.t==='c'?d.p/1000-d.cost*.65:1;
  if(d.speed)v+=2;if(d.block)v+=1;if(d.unbl)v+=1.5;if(d.slayer)v+=1.5;
  if(d.br)v+=d.br-1;if(d.pa)v+=d.pa/2000;if(d.onSum)v+=1.5;
  if(d.trig)v+=2;if(d.noAtk)v-=1.5;if(d.evo)v-=1;
  return v+Math.random()*2.5;
}
// Builds a strong deck using all five civilizations. Each civilization first gets
// 8 cards along a cost curve (cheap, mid, big) from its highest-rated cards, then the
// last 5 slots go to the best remaining cards, so every color has mana to cast with.
function smartDeck(){
  const civs=Object.keys(CIV),CAP=12;
  for(let attempt=0;attempt<60;attempt++){
    const val={};DEFS.forEach(d=>val[d.id]=cardValue(d));
    const counts={},per={};let spells=0;
    const baseOK=d=>!d.evo||Object.keys(counts).some(id=>!DEF[id].evo&&DEF[id].race===d.evo&&counts[id]>=2);
    const add=(d,n)=>{n=Math.min(n,3-(counts[d.id]||0),CAP-(per[d.e]||0));if(d.t==='s')n=Math.min(n,8-spells);if(n<=0)return 0;
      counts[d.id]=(counts[d.id]||0)+n;per[d.e]=(per[d.e]||0)+n;if(d.t==='s')spells+=n;return n};
    const best=(f)=>DEFS.filter(d=>f(d)&&baseOK(d)&&(counts[d.id]||0)<3).sort((x,y)=>val[y.id]-val[x.id]);
    for(const e of shuffle([...civs])){
      for(const [f,n] of [[d=>d.cost<=2,3],[d=>d.cost>=3&&d.cost<=4,3],[d=>d.cost>=5,2]]){
        let need=n;
        for(const d of best(d=>d.e===e&&f(d))){if(need<=0)break;need-=add(d,need)}
      }
    }
    let tot=()=>Object.values(counts).reduce((a,b)=>a+b,0);
    for(const d of best(d=>d.cost<=4)){if(tot()>=DECK_SIZE)break;add(d,Math.min(2,DECK_SIZE-tot()))}
    for(const d of best(()=>true)){if(tot()>=DECK_SIZE)break;add(d,DECK_SIZE-tot())}
    let trig=0;for(const id in counts)if(DEF[id].trig)trig+=counts[id];
    if(tot()===DECK_SIZE&&civs.every(e=>(per[e]||0)>=8)&&trig>=6){
      const ids=[];for(const id in counts)for(let i=0;i<counts[id];i++)ids.push(id);
      return {n:'Random five-civilization deck',ids,counts};
    }
  }
  const pr=PRESETS[0];return {n:pr.n,ids:presetIds(pr.civ),counts:null};
}

const now=()=>Date.now();
function setPhase(){const el=document.documentElement;if(el&&el.style)el.style.setProperty('--ph',`-${now()%8000}ms`)}
function anim(c,k){if(G)(G.fx||(G.fx={}))[c.uid]={k,t0:now()}}
let G=null,UID=0,BUILD={counts:{},msg:'',filter:'fire'};
const DECK_SIZE=50,DECK_MIN=50,DECK_MAX=60,MAX_COPY=4;
const legal=n=>n>=DECK_MIN&&n<=DECK_MAX;
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const inst=id=>({...DEF[id],uid:++UID,tapped:false,sick:true,under:[]});
const opp=p=>G.p[0]===p?G.p[1]:G.p[0];
const atkPow=c=>c.p+(c.pa||0);
function log(m){G.log.unshift(m);if(G.log.length>60)G.log.pop()}

const SHIELDS=8;
// Log lines can name players from either side's view: V(p,'You draw','Opponent draws') shows the first
// text to the player sitting in p's seat and the second to the other player.
let VIEW=0;
const V=(p,you,them)=>`\u0001${p.seat}\u0002${you}\u0002${them}\u0003`;
const seatName=st=>{const p=G&&G.mp&&G.p.find(x=>x.seat===st);return p?esc(p.name):null};
const viewText=t=>String(t).replace(/\u0001(\d)\u0002([^\u0002]*)\u0002([^\u0003]*)\u0003/g,(_,st,a,b)=>{
  if(+st===VIEW)return a;
  const nm=seatName(+st);
  return nm?b.replace(/^Opponent\b/,nm).replace(/^the opponent's$/,nm+"'s").replace(/^the opponent$/,nm):b;
});
function mkPlayer(name,ai,deck,shields=5,seat=0){
  const p={seat,name,ai,deckName:deck.n,deck:shuffle(deck.ids.map(inst)),hand:[],mana:[],bz:[],sh:[],gy:[],charged:false};
  for(let i=0;i<shields;i++)p.sh.push(p.deck.pop());
  for(let i=0;i<5;i++)p.hand.push(p.deck.pop());
  return p;
}
function startGame(mine,theirs){
  if(!theirs){const pre=PRESETS[Math.floor(Math.random()*PRESETS.length)];theirs={n:pre.n,ids:presetIds(pre.civ)}}
  $('#layer').innerHTML='';
  const sh=SHIELDS;
  MP=null;VIEW=0;
  G={shields:sh,p:[mkPlayer('You',false,mine,sh,0),mkPlayer('Opponent',true,theirs,sh,1)],turn:0,turnNo:0,log:[],sel:null,busy:false,targeting:null,modal:null,over:false,fx:{},breaking:null,decks:[mine,theirs]};
  log(`You play ${mine.n}. Opponent plays ${theirs.n}. Each side has ${sh} shields. You go first, so you skip your first draw.`);
  startTurn(0);
}

/* ---------- core rules ---------- */
function draw(p,n){for(let i=0;i<n;i++){if(!p.deck.length){win(opp(p));return}p.hand.push(p.deck.pop())}}
function canPay(p,c){const u=p.mana.filter(m=>!m.tapped);return u.length>=c.cost&&u.some(m=>m.e===c.e)}
const bases=(p,c)=>c.evo?p.bz.filter(x=>x.race===c.evo):[];
const canPlay=(p,c)=>c.playable&&canPay(p,c)&&(!c.evo||bases(p,c).length>0);
// Pays for a card while keeping the most useful mana untapped. It tries every way
// of splitting the cost across civilizations and picks the one that leaves the most
// other cards in hand still playable, then the most different civilizations open.
function pay(p,c){
  const u=p.mana.filter(m=>!m.tapped),civs=Object.keys(CIV),avail={};
  civs.forEach(e=>avail[e]=u.filter(m=>m.e===e).length);
  const others=p.hand.filter(h=>h!==c);
  let best=null,bestScore=-1;
  const tap={};
  (function go(i,left){
    if(i===civs.length){
      if(left||tap[c.e]<1)return;
      const rem={};let total=0;civs.forEach(e=>{rem[e]=avail[e]-tap[e];total+=rem[e]});
      const playable=others.filter(h=>h.cost<=total&&rem[h.e]>0).length;
      const open=civs.filter(e=>rem[e]>0).length;
      const wanted=civs.filter(e=>rem[e]>0&&others.some(h=>h.e===e)).length;
      const score=playable*1000+wanted*100+open*10+Math.min(...civs.filter(e=>avail[e]).map(e=>rem[e]));
      if(score>bestScore){bestScore=score;best={...tap}}
      return;
    }
    const e=civs[i];
    for(let k=Math.min(avail[e],left);k>=0;k--){tap[e]=k;go(i+1,left-k)}
  })(0,c.cost);
  for(const e of civs){let n=best[e];for(const m of u){if(n<=0)break;if(m.e===e&&!m.tapped){m.tapped=true;n--}}}
}
function reset(c){c.tapped=false;c.sick=true}
function leaveBz(p,c){const i=p.bz.indexOf(c);if(i<0)return null;p.bz.splice(i,1);const pile=[c,...c.under];c.under=[];pile.forEach(reset);return pile}
function destroy(p,c){
  const pile=leaveBz(p,c);if(!pile)return;
  p.gy.push(...pile);log(`${c.n} is destroyed.`);
  for(const f of fxList(c.onDie))if(!targetsFor(f,p))simpleFx(p,f,c);
}
function targetsFor(f,p){
  if(f.startsWith('optional:'))return targetsFor(f.slice(9),p);
  const o=opp(p),m=/^burn(\d+)$/.exec(f);
  if(m)return o.bz.filter(c=>c.p<=+m[1]);
  if(f==='bounce'||f==='kill')return o.bz.slice();
  if(f==='killTapped')return o.bz.filter(c=>c.tapped);
  if(f==='tapone')return o.bz.filter(c=>!c.tapped);
  if(f==='bounceAny')return [...o.bz,...p.bz];
  if(f==='killUntapped')return o.bz.filter(c=>!c.tapped);
  if(f==='killBlocker')return o.bz.filter(c=>c.block);
  return null;
}
const whose=o=>V(o,'your',"the opponent's");
function simpleFx(p,f,src){
  const all=/^sweepAll(\d+)$/.exec(f);
  if(all){for(const owner of [p,opp(p)])owner.bz.filter(c=>c.p<=+all[1]).forEach(c=>destroy(owner,c));return}
  if(f==='draw1')f='draw';
  const o=opp(p),sw=/^sweep(\d+)$/.exec(f);
  if(sw){const hit=o.bz.filter(c=>c.p<=+sw[1]);if(!hit.length)log(`${src.n} hits nothing.`);hit.forEach(c=>destroy(o,c));return}
  if(f==='draw'||f==='draw2'||f==='draw3'){const n=f==='draw'?1:+f.slice(4);draw(p,n);log(`${V(p,'You draw','Opponent draws')} ${n===1?'a card':n+' cards'}.`)}
  else if(f==='ramp'||f==='ramp2'){const n=f==='ramp'?1:2;for(let i=0;i<n&&p.deck.length;i++){const c=p.deck.pop();c.tapped=!!c.e2;p.mana.push(c);log(`${c.n} goes to ${whose(p)} mana zone.`)}}
  else if(f==='discardAll'){const o=opp(p);o.gy.push(...o.hand.splice(0));log(`${V(o,'You discard','Opponent discards')} the entire hand.`)}
  else if(f==='tapall'){o.bz.forEach(c=>c.tapped=true);log(`All of ${whose(o)} creatures are tapped.`)}
  else if(f==='discard'||f==='discard2'){const n=f==='discard'?1:2;for(let i=0;i<n&&o.hand.length;i++){const c=o.hand.splice(Math.floor(Math.random()*o.hand.length),1)[0];o.gy.push(c);log(`${V(o,'You discard','Opponent discards')} ${c.n}.`)}}
  else if(f==='shieldadd'||f==='shield2'){const n=f==='shieldadd'?1:2;let k=0;for(;k<n&&p.deck.length;k++)p.sh.push(p.deck.pop());if(k)log(`${V(p,'You add','Opponent adds')} ${k===1?'a shield':k+' shields'}.`)}
  else if(f==='recover'){const c=p.gy.filter(x=>x.t==='c').sort((a,b)=>b.cost-a.cost)[0];if(c){p.gy.splice(p.gy.indexOf(c),1);p.hand.push(c);log(`${c.n} returns from ${whose(p)} graveyard to hand.`)}else log('No creature in the graveyard to return.')}
  else if(f==='manaburn'){if(o.mana.length){const c=o.mana.splice(Math.floor(Math.random()*o.mana.length),1)[0];c.tapped=false;o.gy.push(c);log(`${c.n} is knocked out of ${whose(o)} mana zone.`)}}
}
async function chooseEffect(p,title,text,opts,aiValue){
  if(p.ai)return aiValue;
  if(p.remote)return remoteDecide(p,'choice',{title,text,opts});
  return ask(title,text,opts);
}
async function resolveFx(p,fx,src){
  for(const printedFx of fxList(fx)){
    if(G.over)return;
    const optional=printedFx.startsWith('optional:'),f=optional?printedFx.slice(9):printedFx;
    const up=/^drawUp(\d+)$/.exec(f);
    if(up){
      const max=+up[1],opts=Array.from({length:max+1},(_,n)=>({label:`Draw ${n} card${n===1?'':'s'}`,val:n}));
      const n=await chooseEffect(p,src.n,fxText(f),opts,Math.min(max,p.deck.length));
      if(Number.isInteger(n)&&n>=0&&n<=max)draw(p,n);
      render();continue;
    }
    if(f==='discardShield'){
      if(p.sh.length){
        const opts=p.sh.map((_,i)=>({label:`Shield ${i+1}`,val:i}));
        const index=await chooseEffect(p,src.n,fxText(f),opts,Math.floor(Math.random()*p.sh.length));
        const i=Number.isInteger(index)&&index>=0&&index<p.sh.length?index:0;
        p.gy.push(p.sh.splice(i,1)[0]);log(`${src.n} puts one of ${whose(p)} shields into the graveyard.`);
      }
      render();continue;
    }
    const o=opp(p),tg=targetsFor(f,p);
    if(tg){
      if(!tg.length){log(`${src.n}: no target.`);continue}
      const msg=`${src.n}: ${fxText(f)}`;
      const t=p.ai?tg.slice().sort((a,b)=>(o.bz.includes(b)-o.bz.includes(a))||(b.p-a.p))[0]:p.remote?cardBy(await remoteDecide(p,'target',{uids:tg.map(c=>c.uid),msg,required:!optional})):await pickTarget(tg,msg,optional?'Skip':null);
      if(!t){log(`${src.n}: effect skipped.`);continue}
      const owner=p.bz.includes(t)?p:o;
      if(f==='bounce'||f==='bounceAny'){const pile=leaveBz(owner,t);owner.hand.push(...pile);log(`${t.n} returns to ${whose(owner)} hand.`)}
      else if(f==='tapone'){t.tapped=true;log(`${t.n} is tapped.`)}
      else{anim(t,'die');render();await sleep(450);destroy(owner,t)}
    }else simpleFx(p,f,src);
    render();
  }
}
async function playCard(p,c){
  if(!canPlay(p,c))return;
  let base=null;
  if(c.evo){
    const b=bases(p,c);
    base=b.length===1?b[0]:p.ai?b.sort((x,y)=>(y.sick-x.sick)||(x.p-y.p))[0]:await pickTarget(b,`Choose which ${c.evo} becomes ${c.n}.`,'Cancel');
    if(!base)return;
  }
  pay(p,c);p.hand.splice(p.hand.indexOf(c),1);
  if(c.t==='s'){
    log(`${V(p,'You cast','Opponent casts')} ${c.n}.`);render();
    await resolveFx(p,c.fx,c);p.gy.push(c);
  }else if(base){
    const i=p.bz.indexOf(base);
    c.under=[base,...base.under];base.under=[];
    c.tapped=base.tapped;c.sick=false;p.bz.splice(i,1,c);anim(c,'enter');
    log(`${base.n} evolves into ${c.n}!`);render();
    if(c.onSum)await resolveFx(p,c.onSum,c);
  }else{
    c.tapped=false;c.sick=!c.speed;p.bz.push(c);anim(c,'enter');
    log(`${V(p,'You summon','Opponent summons')} ${c.n}.`);render();
    if(c.onSum)await resolveFx(p,c.onSum,c);
  }
  render();
}
async function battle(ap,a,dp,d){
  const pa=atkPow(a);
  log(`${a.n} (${pa}) battles ${d.n} (${d.p}).`);
  let aDies=pa<=d.p,dDies=d.p<=pa;
  if(a.slayer)dDies=true;if(d.slayer)aDies=true;
  anim(d,'hit');render();await sleep(380);
  if(dDies)anim(d,'die');if(aDies)anim(a,'die');
  if(dDies||aDies){render();await sleep(450)}
  if(dDies)destroy(dp,d);if(aDies)destroy(ap,a);
  render();
}
async function attack(p,att,target){
  const o=opp(p);att.tapped=true;
  anim(att,p===G.p[0]?'up':'down');
  const what=target==='player'?(o.sh.length?`${whose(o)} shields`:V(o,'you','the opponent')+' directly'):target.n;
  log(`${att.n} attacks ${what}.`);render();await sleep(450);
  if(att.onAtk){
    await resolveFx(p,att.onAtk,att);
    if(G.over||!p.bz.includes(att))return;
    if(target!=='player'&&!o.bz.includes(target)){log(`${att.n}'s target is gone.`);return}
  }
  if(!att.unbl){
    const blockers=o.bz.filter(c=>c.block&&!c.tapped);
    if(blockers.length){
      const b=o.ai?aiBlock(o,att,blockers,target):o.remote?cardBy(await remoteDecide(o,'block',{att:att.uid,blockers:blockers.map(x=>x.uid),target:target==='player'?'player':target.uid})):await askBlock(att,blockers,target);
      if(b){b.tapped=true;log(`${b.n} blocks.`);await battle(p,att,o,b);return}
    }
  }
  if(target!=='player'){await battle(p,att,o,target);return}
  if(!o.sh.length){log(`${att.n} lands the final blow.`);win(p);return}
  const n=Math.min(att.br||1,o.sh.length),broken=[];
  G.breaking={p:o,n};render();await sleep(450);G.breaking=null;
  for(let i=0;i<n;i++){const s=o.sh.pop();o.hand.push(s);broken.push(s)}
  log(`${['','A shield breaks','Two shields break','Three shields break'][n]}.`);render();
  for(const s of broken){
    if(!s.trig||G.over)continue;
    const use=o.ai?aiUseTrig(o,s):o.remote?!!(await remoteDecide(o,'trig',{s:s.uid})):await askTrig(s);
    if(use){
      o.hand.splice(o.hand.indexOf(s),1);
      log(`Shield trigger! ${V(o,'You cast','Opponent casts')} ${s.n}.`);render();
      await resolveFx(o,s.fx,s);o.gy.push(s);
    }
  }
  render();
}
function win(p){G.over=true;G.winner=p;G.targeting=null;G.modal=null;log(V(p,'You win!','You lose.'));render();if(G.mp)mpPush(true)}

async function startTurn(i){
  if(G.over)return;
  if(G.p[i].remote){G.turn=i;G.needStart=true;G.sel=null;render();await mpPush(true);return}
  G.turn=i;const p=G.p[i];
  p.mana.forEach(m=>m.tapped=false);
  p.bz.forEach(c=>{c.tapped=false;c.sick=false});
  p.charged=false;
  if(G.turnNo>0){
    if(!p.deck.length){log(`${V(p,'You have','Opponent has')} no cards left to draw.`);win(opp(p));return}
    draw(p,1);
  }
  G.turnNo++;
  log(`${V(p,'Your turn',"Opponent's turn")} ${Math.ceil(G.turnNo/2)} begins.`);
  G.needStart=false;
  render();
  if(G.mp)mpPush(true);
  if(p.ai){
    G.busy=true;render();
    await aiTurn(p);
    G.busy=false;
    if(!G.over)startTurn(0);
  }
}

/* ---------- opponent AI ---------- */
function aiCharge(p){
  if(!p.hand.length)return;
  if(p.mana.length>=8&&p.hand.length<4)return;
  const have=new Set(p.mana.map(m=>m.e));
  const missing=p.hand.filter(c=>!have.has(c.e)).sort((a,b)=>b.cost-a.cost);
  const byCost=[...p.hand].sort((a,b)=>p.mana.length<4?b.cost-a.cost:a.cost-b.cost);
  const pick=(p.mana.length<4&&missing[0])||byCost[0];
  p.hand.splice(p.hand.indexOf(pick),1);pick.tapped=false;p.mana.push(pick);p.charged=true;
  log(`Opponent charges ${pick.n} as mana.`);
}
function fxUseful(p,f){
  const o=opp(p),tg=targetsFor(f,p);
  if(tg)return tg.length>0;
  const sw=/^sweep(\d+)$/.exec(f);
  if(sw)return o.bz.some(x=>x.p<=+sw[1]);
  if(f.startsWith('ramp'))return p.mana.length<8&&p.deck.length>6;
  if(f==='tapall')return o.bz.filter(x=>!x.tapped).length>=1;
  if(f==='recover')return p.gy.some(x=>x.t==='c');
  if(f.startsWith('discard'))return o.hand.length>0;
  if(f==='manaburn')return o.mana.length>0;
  if(f.startsWith('shield'))return p.deck.length>6;
  return p.deck.length>4;
}
function aiWants(p,c){
  if(c.t!=='s')return true;
  return fxList(c.fx).some(f=>fxUseful(p,f));
}
function aiBlock(o,att,blockers,target){
  const pa=atkPow(att),sorted=blockers.sort((a,b)=>a.p-b.p);
  const winner=sorted.find(b=>b.p>pa||b.slayer);
  if(winner)return winner;
  if(target==='player'&&o.sh.length<=(att.br||1))return sorted[0];
  return null;
}
function aiUseTrig(o,s){return fxList(s.fx).some(f=>fxUseful(o,f))}
async function aiTurn(p){
  await sleep(600);
  aiCharge(p);render();
  for(let guard=0;guard<10&&!G.over;guard++){
    const opts=p.hand.filter(c=>canPlay(p,c)&&aiWants(p,c)).sort((a,b)=>(b.cost+(b.evo?1:0))-(a.cost+(a.evo?1:0)));
    if(!opts.length)break;
    await sleep(700);await playCard(p,opts[0]);
  }
  const me=G.p[0];
  for(const c of [...p.bz]){
    if(G.over)return;
    if(!p.bz.includes(c)||c.tapped||c.sick||c.noAtk)continue;
    const pa=atkPow(c);
    const prey=me.bz.filter(x=>(x.tapped||c.hunts)&&(c.slayer||pa>x.p)).sort((a,b)=>b.p-a.p)[0];
    if(c.noP){if(prey){await sleep(800);await attack(p,c,prey)}continue}
    const blockers=me.bz.filter(x=>x.block&&!x.tapped);
    const top=Math.max(0,...blockers.map(b=>b.p));
    const safe=c.unbl||!blockers.length||pa>top||c.slayer;
    if(prey&&(prey.p>=4000||me.sh.length>2)){await sleep(800);await attack(p,c,prey);continue}
    if(safe||me.sh.length===0||Math.random()<0.3){await sleep(800);await attack(p,c,'player');continue}
    if(prey){await sleep(800);await attack(p,c,prey)}
  }
  await sleep(500);
}

/* ---------- player prompts ---------- */
function pickTarget(tg,msg,skip){
  return new Promise(res=>{G.targeting={uids:new Set(tg.map(c=>c.uid)),resolve:res,msg,skip,required:skip===null};render()});
}
function ask(title,text,opts,card){

}
function askBlock(att,blockers,target){
  const what=target==='player'?(G.p[0].sh.length?'your shields':'you directly'):target.n;
  const extra=[att.pa?`power ${atkPow(att)} while attacking`:'',att.br?['','','double breaker','triple breaker'][att.br]:''].filter(Boolean).join(', ');
  return ask('Block?',`${att.n} (${att.p}${extra?', '+extra:''}) is attacking ${what}.`,
    [...blockers.map(b=>({label:`Block with ${b.n} (${b.p})`,val:b})),{label:"Don't block",val:null}],att);
}
function askTrig(s){
  return ask('Shield trigger!',`${s.n} came from your shield. ${fxDesc(s.fx)}`,
    [{label:'Cast it for free',val:true,main:1},{label:'Keep it in hand',val:false}],s);

/* ---------- input ---------- */
function findCard(uid){
  if(!G)return null;
  for(const p of G.p)for(const z of ['hand','bz']){const c=p[z].find(x=>x.uid===uid);if(c)return{p,z,c}}
  return null;
}
const selCard=()=>G&&G.sel?findCard(G.sel.uid)?.c:null;
async function act(fn){G.busy=true;G.sel=null;render();try{await fn()}finally{G.busy=false;render()}}
function onCard(uid){
  if(!G||G.over||G.modal)return;
  if(G.targeting){
    if(G.targeting.uids.has(uid)){const r=G.targeting.resolve;const t=findCard(uid).c;G.targeting=null;r(t)}
    return;
  }
  const f=findCard(uid);if(!f)return;
  if(G.turn!==0||G.busy){openZoom(f.c);return}
  const me=G.p[0];
  if(f.p===me&&f.z==='hand')G.sel=G.sel?.uid===uid?null:{zone:'hand',uid};
  else if(f.p===me&&f.z==='bz'&&!f.c.tapped&&!f.c.sick&&!f.c.noAtk)G.sel=G.sel?.uid===uid?null:{zone:'bz',uid};
  else if(f.p!==me&&f.z==='bz'&&(f.c.tapped||selCard()?.hunts)&&G.sel?.zone==='bz'){const a=selCard();act(()=>attack(me,a,f.c));return}
  else{G.sel=null;openZoom(f.c)}
  render();
}
function onAct(a,v){
  // menus and deck builder
  if(a==='setmode'){PLAYMODE=v==='friend'?'friend':'cpu';renderModeSw();try{window.storage.set('shieldclash-mode',PLAYMODE,false)}catch(e){}return}
  if(a==='preset'){const pr=PRESETS[+v];playWith('p'+v,()=>({n:pr.n,ids:presetIds(pr.civ)}));return}
  if(a==='builder'){showBuilder();return}
  if(a==='dedit'){showBuilder(v);return}
  if(a==='dplay'){const d=MYDECKS&&MYDECKS.find(x=>x.id===v);if(d&&legal(deckTotal(d.counts)))playWith('d'+d.id,()=>({n:d.name,ids:expand(d.counts)}));return}
  if(a==='ddel'){PENDING_DEL=v;renderMyDecks();return}
  if(a==='ddelno'){PENDING_DEL=null;renderMyDecks();return}
  if(a==='ddelyes'){MYDECKS=MYDECKS.filter(x=>x.id!==v);PENDING_DEL=null;storeDecks().then(renderMyDecks);return}
  if(a==='tut'){showTutorial(0);return}
  if(a==='tnext'){showTutorial(TUT+1);return}
  if(a==='tprev'){showTutorial(TUT-1);return}
  if(a==='tgo'){showTutorial(+v);return}
  if(a==='tclose'){showStart();return}
  if(a==='random'){playWith('random',smartDeck);return}
  if(a==='brandom'){const d=smartDeck();if(d.counts){BUILD.counts={...d.counts};BUILD.msg=`${d.n}: a fresh mixed deck. Tweak it or start the duel.`}renderBuilder();autoSave();return}
  if(a==='new'||a==='back'){if(MP)mpLeave(true);else showStart();return}
  if(a==='online'){showOnline();return}
  if(a==='mphost'){mpHost();return}
  if(a==='mpjoin'){mpJoin();return}
  if(a==='mpcancel'){mpLeave(true);if(!IN_CLAUDE)netClose();return}
  if(a==='menu'&&G&&G.mp&&!G.over&&!G.modal&&!G.targeting){
    ask('Game menu',`Leaving ends the game for both of you, and ${esc(G.p[1].name)} wins.`,
      [{label:'Keep playing',val:null,main:1},{label:'Leave game',val:'leave'}]).then(v=>{if(v==='leave')mpLeave()});
    return}
  if(a==='menu'&&G&&!G.over&&G.turn===0&&!G.busy&&!G.modal&&!G.targeting){
    G.sel=null;
    ask('Game menu','Restarting deals a fresh game with the same two decks. Your current game will be lost.',
      [{label:'Keep playing',val:null,main:1},{label:'Restart this game',val:'restart'},{label:'Back to start page',val:'start'}])
    .then(v=>{if(v==='restart')startGame(...G.decks);else if(v==='start')showStart()});
    return}
  if(a==='bplus'){if(DEF[v]?.playable&&DEF[v].duelId===v&&total()<DECK_MAX&&(BUILD.counts[v]||0)<MAX_COPY)BUILD.counts[v]=(BUILD.counts[v]||0)+1;BUILD.msg='';renderBuilder();autoSave();return}
  if(a==='bminus'){if(BUILD.counts[v])BUILD.counts[v]--;BUILD.msg='';renderBuilder();autoSave();return}
  if(a==='bfilter'){BUILD.filter=v;renderBuilder();window.scrollTo(0,0);return}
  if(a==='bclear'){BUILD.counts={};BUILD.msg='';renderBuilder();autoSave();return}
  if(a==='bfill'){fillDeck();renderBuilder();autoSave();return}
  if(a==='bsave'){saveDeck(true);return}
  if(a==='bstart'&&legal(total())){const ids=expand(BUILD.counts),n=(BUILD.name||'').trim()||'Your deck';saveDeck().then(()=>{if(PLAYMODE==='friend'&&BUILD.id)showOnline(null,'d'+BUILD.id);else startGame({n,ids})});return}
  if(!G)return;
  // in game
  if(a==='ans'&&G.modal){const m=G.modal;G.modal=null;render();m.resolve(m.opts[+v].val);return}
  if(a==='skip'&&G.targeting&&!G.targeting.required){const r=G.targeting.resolve;G.targeting=null;r(null);return}
  if(G.turn!==0||G.busy||G.over)return;
  const me=G.p[0],s=selCard();
  if(a==='charge'&&s&&!me.charged){me.hand.splice(me.hand.indexOf(s),1);s.tapped=false;me.mana.push(s);me.charged=true;G.sel=null;log(`${V(me,'You charge','Opponent charges')} ${s.n} as mana.`);render()}
  else if(a==='play'&&s)act(()=>playCard(me,s));
  else if(a==='atkp'&&s&&!s.noP&&!s.noAtk)act(()=>attack(me,s,'player'));
  else if(a==='cancel'){G.sel=null;render()}
  else if(a==='view'&&s)openZoom(s);
  else if(a==='end'){G.sel=null;startTurn(1)}
}

/* ---------- deck builder ---------- */
const total=()=>Object.values(BUILD.counts).reduce((a,b)=>a+b,0);
function fillDeck(){
  let civs=[...new Set(Object.keys(BUILD.counts).filter(id=>BUILD.counts[id]>0).map(id=>DEF[id].e))];
  if(!civs.length)civs=shuffle(Object.keys(CIV)).slice(0,2);
  const pool=DEFS.filter(d=>civs.includes(d.e));
  let guard=0;
  while(total()<DECK_SIZE&&guard++<500){
    const open=pool.filter(d=>(BUILD.counts[d.id]||0)<MAX_COPY);
    if(!open.length)break;
    // favour cheaper cards so the deck has early plays
    const w=open.map(d=>Math.max(1,9-d.cost));
    let r=Math.random()*w.reduce((a,b)=>a+b,0),pick=open[0];
    for(let i=0;i<open.length;i++){r-=w[i];if(r<=0){pick=open[i];break}}
    BUILD.counts[pick.id]=(BUILD.counts[pick.id]||0)+1;
  }
  BUILD.msg=total()<DECK_SIZE?`Not enough cards in these civilizations to reach ${DECK_SIZE}. Add another civilization.`:'';
}
let MYDECKS=null,saveT=null,PENDING_DEL=null;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validCounts=counts=>Object.fromEntries(Object.entries(counts).filter(([id])=>DEF[id]?.playable&&DEF[id].duelId===id).map(([id,n])=>[id,Math.min(MAX_COPY,Math.max(0,Math.floor(Number(n)||0)))]));
const expand=counts=>{const ids=[];for(const [id,n] of Object.entries(validCounts(counts)))for(let i=0;i<n;i++)ids.push(id);return ids};
const deckTotal=counts=>Object.values(validCounts(counts)).reduce((a,b)=>a+b,0);
async function storeDecks(){try{return !!(await window.storage.set('shieldclash-decks',JSON.stringify(MYDECKS),false))}catch(e){return false}}
async function loadDecks(){
  if(MYDECKS)return MYDECKS;
  let list=[];
  try{const r=await window.storage.get('shieldclash-decks',false);if(r&&r.value)list=JSON.parse(r.value)}catch(e){}
  if(!list.length){ // bring over a deck saved by the older single-deck version
    try{const r=await window.storage.get('shieldclash-deck',false);if(r&&r.value){const c=JSON.parse(r.value);if(deckTotal(c))list.push({id:'d'+Date.now(),name:'My deck',counts:c,updated:Date.now()})}}catch(e){}
  }
  MYDECKS=list;
  return MYDECKS;
}
function setSaved(t){BUILD.saved=t;const el=document.getElementById('bsaved');if(el)el.textContent=t}
function autoSave(){clearTimeout(saveT);setSaved('Saving…');saveT=setTimeout(()=>saveDeck(),400)}
async function saveDeck(manual){
  clearTimeout(saveT);
  if(!total()){setSaved(BUILD.id?'Empty decks are not saved':'');if(manual){BUILD.msg='Add some cards before saving.';renderBuilder()}return}
  await loadDecks();

// Fit rendered text rather than guessing from character counts: wrapping also
// depends on word lengths, reminders, the font, and the displayed card width.
const pendingCardFits=new Set();
const cardTextSizes=new Map();
let cardFitFrame=0;
function fitCardText(card){
  if(!card.isConnected||!card.clientWidth)return;
  for(const selector of ['.txt']){
    const text=card.querySelector(selector);
    if(!text)continue;
    text.style.removeProperty('font-size');
    const style=getComputedStyle(text),maxSize=parseFloat(style.fontSize);
    const key=[selector,text.textContent,text.clientWidth,text.clientHeight,style.font,style.letterSpacing].join('|');
    const cached=cardTextSizes.get(key);
    if(cached!==undefined){
      if(cached!==maxSize)text.style.fontSize=cached+'px';
      continue;
    }
    const fits=()=>text.scrollWidth<=text.clientWidth&&text.scrollHeight<=text.clientHeight;
    if(fits()){cardTextSizes.set(key,maxSize);continue}
    let low=1,high=maxSize;
    // Find the largest font that fits both the available width and height.
    for(let i=0;i<8;i++){
      const mid=(low+high)/2;
      text.style.fontSize=mid+'px';
      if(fits())low=mid;else high=mid;
    }
    text.style.fontSize=low+'px';
    cardTextSizes.set(key,low);
  }
}
function queueCardFit(card){
  pendingCardFits.add(card);
  if(cardFitFrame)return;
  cardFitFrame=requestAnimationFrame(()=>{
    cardFitFrame=0;
    pendingCardFits.forEach(fitCardText);
    pendingCardFits.clear();
  });
}
const cardSizeObserver=new ResizeObserver(entries=>entries.forEach(({target})=>queueCardFit(target)));

    record.addedNodes.forEach(node=>cardsIn(node).forEach(card=>{cardSizeObserver.observe(card);queueCardFit(card)}));
  }
}).observe(document.body,{childList:true,subtree:true});

// ---- relay link (used outside Claude) ----
// Both devices connect to a free public MQTT relay server over a normal secure web
// connection (the same kind web pages use), so it works on almost any network.
// Each key is saved as a "retained" message on the room's topic, so the relay
// remembers the latest value and both devices see the same data.
const NET={map:{},client:null,code:null,status:'',url:null};
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const MQ_SRC=['https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js','https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js','https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js'];
const TOP='shieldclash/v1/';
const keyTopic=k=>TOP+k.split(':').join('/');
const topicKey=t=>t.slice(TOP.length).split('/').join(':');
let mqLib=null;
function loadMQTT(){
  if(window.mqtt&&window.mqtt.connect)return Promise.resolve(window.mqtt);
  if(mqLib)return mqLib;
  mqLib=new Promise((res,rej)=>{
    let i=0;
    const next=()=>{
      if(i>=MQ_SRC.length){mqLib=null;rej(new Error('lib'));return}
      const sc=document.createElement('script');sc.src=MQ_SRC[i++];sc.async=true;
      sc.onload=()=>window.mqtt&&window.mqtt.connect?res(window.mqtt):next();sc.onerror=()=>{sc.remove();next()};
      document.head.appendChild(sc);
    };
    next();
  });
  return mqLib;
}
function netStatus(t){if(NET.status===t)return;NET.status=t;if(G&&G.mp)render()}
function mqConnect(url,code){
  return new Promise((res,rej)=>{
    let c;
    try{c=window.mqtt.connect(url,{clientId:'sc_'+Math.random().toString(36).slice(2,12),clean:true,connectTimeout:8000,reconnectPeriod:2000,keepalive:30})}catch(e){rej(e);return}
    const t=setTimeout(()=>{try{c.end(true)}catch(e){}rej(new Error('timeout'))},9000);
    attachClient(c); // listen before subscribing so saved room data that arrives right away isn't missed
    c.once('connect',()=>{
      clearTimeout(t);
      c.subscribe(TOP+'scroom/'+code+'/#',{qos:1},err=>err?rej(err):res(c));
    });
    c.on('error',()=>{});
  });
}
function attachClient(c){
  NET.client=c;
  c.on('message',(topic,payload)=>{
    if(NET.client!==c)return;
    const k=topicKey(topic),txt=payload&&payload.length?new TextDecoder().decode(payload):'';
    if(!txt)delete NET.map[k];else{try{NET.map[k]=JSON.parse(txt)}catch(e){}}
  });

  c.on('reconnect',()=>{if(MP)netStatus('Connection lost. Reconnecting…')});
  c.on('connect',()=>netStatus(''));
}
const waitFor=(f,ms)=>new Promise(r=>{const t0=Date.now();const k=()=>{if(f())r(true);else if(Date.now()-t0>ms)r(false);else setTimeout(k,100)};k()});
function netClose(){try{NET.client&&NET.client.end(true)}catch(e){}NET.client=null;NET.map={};NET.status=''}
// Host: connect to the first relay that answers, and make sure the room code is free there.
async function netHost(code){
  try{await loadMQTT()}catch(e){throw Object.assign(new Error('lib'),{why:'lib'})}
  netClose();NET.code=code;
  for(const url of BROKERS){
    let c;try{c=await mqConnect(url,code)}catch(e){continue}
    NET.url=url;
    await sleep(1200); // let the relay send any old data saved under this code
    const old=NET.map[RK(code,'lobby')];
    if(old&&!old.ended&&Date.now()-(old.t||0)<6*3600e3){netClose();throw Object.assign(new Error('taken'),{taken:true})}
    for(const part of ['state','left','lobby'])await sdel(RK(code,part));
    NET.map={};
    return true;
  }
  throw Object.assign(new Error('server'),{why:'server'});
}
// Guest: try each relay in the same order and use the one where the room exists.
async function netJoin(code){
  try{await loadMQTT()}catch(e){throw Object.assign(new Error('lib'),{why:'lib'})}
  netClose();NET.code=code;
  let reached=false;
  for(const url of BROKERS){
    let c;try{c=await mqConnect(url,code)}catch(e){continue}
    reached=true;NET.url=url;
    if(await waitFor(()=>NET.map[RK(code,'lobby')],3000))return true;
    netClose();
  }
  throw Object.assign(new Error(reached?'none':'server'),{why:reached?'none':'server'});
}
async function sget(k){
  if(!IN_CLAUDE)return k in NET.map?JSON.parse(JSON.stringify(NET.map[k])):null;
  try{const r=await window.storage.get(k,true);return r&&r.value?JSON.parse(r.value):null}catch(e){return null}
}
async function sset(k,v){
  if(!IN_CLAUDE){
    NET.map[k]=v;
    if(!NET.client)return false;
    return new Promise(res=>{try{NET.client.publish(keyTopic(k),JSON.stringify(v),{qos:1,retain:true},err=>res(!err))}catch(e){res(false)}});
  }
  try{return !!(await window.storage.set(k,JSON.stringify(v),true))}catch(e){return false}
}
async function sdel(k){
  if(!IN_CLAUDE){
    delete NET.map[k];
    if(NET.client)await new Promise(res=>{try{NET.client.publish(keyTopic(k),'',{qos:1,retain:true},()=>res())}catch(e){res()}});
    return;
  }

const cardBy=uid=>uid==null?null:(findCard(uid)?.c||null);
const ZONES=['deck','hand','mana','bz','sh','gy'];
const packCard=c=>{const o={i:c.id,u:c.uid};if(c.tapped)o.t=1;if(c.sick)o.s=1;if(c.under&&c.under.length)o.d=c.under.map(packCard);return o};
const unpackCard=o=>({...DEF[o.i],uid:o.u,tapped:!!o.t,sick:!!o.s,under:(o.d||[]).map(unpackCard)});
function packPlayer(p){const q={seat:p.seat,name:p.name,deckName:p.deckName,charged:!!p.charged};ZONES.forEach(z=>q[z]=p[z].map(packCard));return q}
function unpackPlayer(q){const p={seat:q.seat,name:q.name,deckName:q.deckName,charged:!!q.charged};ZONES.forEach(z=>p[z]=(q[z]||[]).map(unpackCard));return p}
function toWire(){
  const canon=G.p[0].seat===0?[G.p[0],G.p[1]]:[G.p[1],G.p[0]];
  return {seq:MP.seq,players:canon.map(packPlayer),turnSeat:G.p[G.turn].seat,turnNo:G.turnNo,
    log:G.log.slice(0,40),over:G.over,winnerSeat:G.over&&G.winner?G.winner.seat:null,req:G.req||null,needStart:!!G.needStart,left:G.left??null};
}
function fromWire(w){
  const pl=w.players.map(q=>({...unpackPlayer(q),remote:q.seat!==MP.seat,ai:false}));
  const keep=G&&G.mp?{modal:G.modal,targeting:G.targeting}:{modal:null,targeting:null};
  G={mp:true,shields:SHIELDS,p:[pl[MP.seat],pl[1-MP.seat]],turn:w.turnSeat===MP.seat?0:1,turnNo:w.turnNo,log:w.log,over:w.over,
    winner:w.winnerSeat==null?null:pl[w.winnerSeat],req:w.req,needStart:w.needStart,left:w.left,busy:false,fx:{},breaking:null,sel:null,...keep};
}
let pushT=null;
function mpPush(now){
  if(!MP||!G||!G.mp)return Promise.resolve();
  clearTimeout(pushT);
  if(now)return doPush();
  pushT=setTimeout(doPush,350);return Promise.resolve();
}
async function doPush(){
  clearTimeout(pushT);if(!MP)return;
  MP.seq++;MP.lastSeq=MP.seq;
  const ok=await sset(RK(MP.code,'state'),toWire());
  if(!ok&&MP){MP.retry=(MP.retry||0)+1;if(MP.retry<6)setTimeout(()=>mpPush(true),1500)}else if(MP)MP.retry=0;
}
async function remoteDecide(p,kind,payload){
  const id=Math.random().toString(36).slice(2,10);
  G.req={id,seat:p.seat,kind,payload};MP.waiting=true;render();await mpPush(true);
  try{
    for(let i=0;i<600&&MP&&G&&!G.over;i++){
      await sleep(1200);
      const a=await sget(RK(MP.code,'ans:'+id));
      if(a){await sdel(RK(MP.code,'ans:'+id));return a.v}
    }
    return null;
  }finally{if(G)G.req=null;if(MP)MP.waiting=false;if(G)render()}
}
async function mpRespond(req){
  MP.responding=true;let val=null;
  try{
    const pl=req.payload;
    if(req.kind==='block'){const b=await askBlock(cardBy(pl.att),pl.blockers.map(cardBy).filter(Boolean),pl.target==='player'?'player':cardBy(pl.target));val=b?b.uid:null}
    else if(req.kind==='trig'){val=!!(await askTrig(cardBy(pl.s)))}
    else if(req.kind==='target'){const t=await pickTarget(pl.uids.map(cardBy).filter(Boolean),pl.msg,pl.required?null:'Skip');val=t?t.uid:null}
    else if(req.kind==='choice'){val=await ask(pl.title,pl.text,pl.opts)}
    if(MP)await sset(RK(MP.code,'ans:'+req.id),{v:val});
    if(MP)MP.answered=req.id;
  }finally{if(MP)MP.responding=false;if(G)render()}
}
async function mpPoll(){
  if(!MP)return;
  try{
    if(G&&G.mp&&!G.over){
      const lf=await sget(RK(MP.code,'left'));
      if(lf!=null&&lf!==MP.seat){G.over=true;G.left=lf;G.winner=G.p[0];G.modal=null;G.targeting=null;render();return}
    }
    if(MP.responding||MP.waiting)return;
    if(G&&G.mp&&G.turn===0&&!G.over&&!G.needStart)return;
    const w=await sget(RK(MP.code,'state'));
    if(!w||w.seq<=MP.lastSeq)return;
    MP.lastSeq=w.seq;MP.seq=Math.max(MP.seq,w.seq);
    if(!G||!G.mp)$('#layer').innerHTML='';
    MP.applying=true;fromWire(w);render();MP.applying=false;
    if(G.req&&G.req.seat===MP.seat&&MP.answered!==G.req.id&&!G.over)mpRespond(G.req);
    else if(G.turn===0&&G.needStart&&!G.over)startTurn(0);
  }finally{if(MP){clearTimeout(MP.timer);MP.timer=setTimeout(mpPoll,1400)}}
}
async function mpLeave(quiet){
  if(MP){
    clearTimeout(MP.timer);clearTimeout(MP.lobbyT);
    const code=MP.code,seat=MP.seat,inGame=G&&G.mp&&!G.over;
    MP=null;

}

function pickedDeck(v){

  if(v[0]==='d'){const d=MYDECKS.find(x=>x.id===v.slice(1));if(d)return {n:d.name,ids:expand(d.counts)}}

}

function joinError(e,code){
  const why=e&&e.why;
  if(why==='none')return `No room found with the code ${code}. Check the code with your friend. If they closed the room screen, they'll need to create a new room.`;
  if(why==='server')return "Couldn't reach any of the free relay servers. Check your internet connection and try again in a minute.";
  if(why==='lib')return "Couldn't load the connection library. Check your internet connection, or turn off any content blocker for this site.";
  return "Couldn't connect to that room. Try again.";

async function mpHost(){
  const {name,deck}=readForm();
  const L='ABCDEFGHJKMNPQRSTUVWXYZ';
  let code=Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join('');
  if(!IN_CLAUDE){
    lobbyScreen('Creating room…','<p class="hint">Setting up the connection.</p>');
    let ok=false;
    for(let t=0;t<4&&!ok;t++){
      try{await netHost(code);ok=true}catch(e){if(e&&e.taken)code=Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join('');else break}
    }
    if(!ok){netClose();showOnline("Couldn't reach any of the free relay servers. Check your internet connection and try again in a minute.");return}
  }
  const ok=await sset(RK(code,'lobby'),{host:{name,deck},guest:null,t:Date.now()});
  if(!ok){showOnline('Could not create a room. Check your connection and try again.');return}
  MP={code,seat:0,seq:0,lastSeq:0};VIEW=0;
  lobbyScreen('Room created',`<p>Send this code to your friend:</p><p class="code">${code}</p><p class="hint">Waiting for them to join… You'll go first.</p>${IN_CLAUDE?'':'<p class="hint">Keep this screen open until they join.</p>'}`);
  const wait=async()=>{
    if(!MP||MP.code!==code)return;
    const lob=await sget(RK(code,'lobby'));
    if(lob&&lob.guest){
      $('#layer').innerHTML='';
      const me=mkPlayer(name,false,deck,SHIELDS,0),them=mkPlayer(lob.guest.name,false,lob.guest.deck,SHIELDS,1);
      them.remote=true;
      G={mp:true,shields:SHIELDS,p:[me,them],turn:0,turnNo:0,log:[],sel:null,busy:false,targeting:null,modal:null,over:false,fx:{},breaking:null,req:null};
      log(`${esc(name)} (${esc(deck.n)}) vs ${esc(lob.guest.name)} (${esc(lob.guest.deck.n)}). Each side has ${SHIELDS} shields. ${esc(name)} goes first and skips the first draw.`);
      await sset(RK(code,'lobby'),{...lob,started:true});
      startTurn(0);
      MP.timer=setTimeout(mpPoll,1400);
      return;
    }
    MP.lobbyT=setTimeout(wait,1500);
  };
  wait();
}
async function mpJoin(){
  const code=(document.getElementById('mpcode').value||'').trim().toUpperCase();
  if(!/^[A-Z]{4}$/.test(code)){showOnline('Enter the 4-letter room code.');return}
  const {name,deck}=readForm();
  if(!IN_CLAUDE){
    lobbyScreen(`Joining ${code}…`,'<p class="hint">Connecting to your friend\'s device.</p>');
    try{await netJoin(code)}catch(e){netClose();showOnline(joinError(e,code));return}
  }
  const lob=await sget(RK(code,'lobby'));
  if(!lob){netClose();showOnline(`No room found with the code ${code}.`);return}
  if(lob.guest){netClose();showOnline('That room already has two players.');return}
  const ok=await sset(RK(code,'lobby'),{...lob,guest:{name,deck}});
  if(!ok){showOnline('Could not join the room. Check your connection and try again.');return}
  MP={code,seat:1,seq:0,lastSeq:0};VIEW=1;
  lobbyScreen(`Joined room ${code}`,`<p>You're playing against ${esc(lob.host.name)}.</p><p class="hint">Waiting for the game to start…</p>`);
  MP.timer=setTimeout(mpPoll,1000);
}

    <div class="decks">${PRESETS.map((d,i)=>`<button class="deck" data-act="preset" data-v="${i}">
      <span class="dots">${d.civ.map(e=>`<span style="--el:${CIV[e].c}"></span>`).join('')}</span>
      <b>${d.n}</b><small>${CIV[d.civ[0]].n} and ${CIV[d.civ[1]].n}. ${d.d}</small></button>`).join('')}
      <button class="deck" data-act="random"><span class="dots"><span style="--el:#A32D2D"></span><span style="--el:#185FA5"></span><span style="--el:#3B6D11"></span><span style="--el:#854F0B"></span><span style="--el:#3C3489"></span></span><b>Random optimal deck</b><small>A strong mix of all five civilizations, built fresh every time.</small></button>
      <button class="deck" data-act="builder"><b>Build a new deck</b><small>Choose 50 to 60 cards. It saves automatically and shows up here.</small></button></div>
    <p class="credit">Made by Tejas Jadhav and Claude Opus 5.5</p>
  </div></div>`;
  PENDING_DEL=null;
  renderModeSw();
  loadDecks().then(renderMyDecks);
}
showStart();
</script>
</body>
